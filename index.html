    feesOpen,
    grossWin,
  };
}

function clampConfig(config){
  const next = { ...config };
  if (next.leverage != null) next.leverage = Math.max(1, Math.min(100, Math.round(next.leverage)));
  if (next.levels != null) next.levels = Math.max(1, Math.min(64, Math.round(next.levels)));
  if (next.huntPct != null) next.huntPct = Math.max(0.03, Math.min(5, next.huntPct));
  if (next.gridStepPct != null) next.gridStepPct = Math.max(0.05, Math.min(5, next.gridStepPct));
  if (next.cycleBalance != null) next.cycleBalance = Math.max(1, next.cycleBalance);
  if (next.edition != null && next.edition !== "trading") next.edition = "classic";
  return next;
}

function applyLiveConfig(state, patch){
  const next = cloneState(state);
  const prev = next.config;
  next.config = { ...next.config, ...clampConfig(patch) };
  const symbolChanged = Boolean(patch.symbol && patch.symbol !== prev.symbol);
  if (symbolChanged) {
    const old = prev.displaySymbol || prev.symbol;
    const neu = next.config.displaySymbol || next.config.symbol;
    next.grid = [];
    next.position = null;
    next.openLot = null;
    next.journal = [];
    next.cycles = [];
    next.cycleSeq = 0;
    next.activeCycle = null;
    next.huntCount = 0;
    next.huntOpen = 0;
    next.hunting = next.status === "running";
    next.huntAnchor = null;
    next.gridAnchor = null;
    next.entryZone = null;
    next.priceTrail = [];
    next.emaFast = null;
    next.emaSlow = null;
    next.lastAddAt = null;
    next.shieldFrozen = false;
    next.ignoreExchangePosUntil = Date.now() + 12_000;
    next.logs = [
      {
        id: uid("log"),
        at: Date.now(),
        kind: "server",
        text: `\u0627\u0646\u062a\u0642\u0627\u0644 \u0645\u0646 ${old} \u0625\u0644\u0649 ${neu} \u2014 \u0623\u064f\u0644\u063a\u064a\u062a \u0623\u0648\u0627\u0645\u0631 \u0627\u0644\u0639\u0645\u0644\u0629 \u0627\u0644\u0633\u0627\u0628\u0642\u0629`,
      },
    ];
    return next;
  }
  const shape =
    prev.levels !== next.config.levels ||
    prev.gridStepPct !== next.config.gridStepPct ||
    prev.leverage !== next.config.leverage ||
    prev.directionMode !== next.config.directionMode;
  if (next.status === "running" && shape) {
    cancelPendingAdds(next);
    const center = next.lastPrice || next.gridAnchor || next.position?.entry;
    if (center) {
      const keep = next.grid.filter(
        (g) => g.status === "filled" || (g.reduceOnly && (g.status === "open" || g.status === "armed")),
      );
      next.grid = [...keep, ...buildGrid(next, center)];
      next.gridAnchor = center;
      next.entryZone = entryZoneFromGrid(next.grid, center);
      next.grid.sort((a, b) => b.price - a.price);
      pushLog(next, "server", "\u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0627\u0644\u062c\u062f\u064a\u062f\u0629 \u0637\u064f\u0628\u0651\u0642\u062a \u0639\u0644\u0649 \u0627\u0644\u0634\u0628\u0643\u0629 \u0641\u0648\u0631\u0627\u064b");
    }
  }
  return next;
}

/* ============================================================
   \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0645\u0646\u0635\u0629 KuCoin \u2014 REST \u0645\u0648\u0642\u0651\u0639 + WebSocket \u062d\u064a \u0639\u0644\u0649 \u0645\u062f\u0627\u0631 \u0627\u0644\u0633\u0627\u0639\u0629
   \u062f\u0627\u062e\u0644 WebView/APK \u062a\u0645\u0631 \u0627\u0644\u0637\u0644\u0628\u0627\u062a \u0627\u0644\u0645\u0648\u0642\u0651\u0639\u0629 \u0639\u0628\u0631 \u0627\u0644\u0648\u0633\u064a\u0637 \u2014 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0645\u062d\u062c\u0648\u0628 \u0628\u0640 CORS
   ============================================================ */
let contractMetaCache = new Map();
let klineCache = new Map();
let klineInflight = new Map();
let marketCache = new Map();
let contractCache = null;
let kcFailStreak = 0;
let networkBlocked = false; // \u0627\u0644\u0645\u062a\u0635\u0641\u062d \u064a\u0645\u0646\u0639 CORS \u2014 \u064a\u0641\u0639\u0651\u0644 \u0648\u0636\u0639 \u0627\u0644\u0645\u062d\u0627\u0643\u0627\u0629

function num(v, fallback = 0){
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function sleep(ms){
  return new Promise((r) => setTimeout(r, ms));
}

function isTransient(err){
  const msg = err instanceof Error ? `${err.name} ${err.message}` : String(err ?? "");
  return /abort|timeout|429|503|502|500|504|fetch failed|network|econnreset|etimedout|socket|too many|rate limit|kucoin 4|kucoin 5/i.test(msg);
}

function readableKc(err){
  const raw = err instanceof Error ? err.message : String(err ?? "");
  if (!hasNativeHttp() && /failed to fetch|networkerror|load failed|timed?.?out|signal timed out|typeerror/i.test(raw)) {
    networkBlocked = true;
    return new Error("\u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 KuCoin: \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0645\u062d\u062c\u0648\u0628 (CORS) \u0648\u0627\u0644\u0648\u0633\u064a\u0637 \u0644\u0645 \u064a\u0633\u062a\u062c\u0628 \u0627\u0644\u0622\u0646. \u0647\u0630\u0627 \u0644\u064a\u0633 \u062e\u0637\u0623\u064b \u0641\u064a \u0645\u0641\u0627\u062a\u064a\u062d\u0643. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u0623\u0648 \u0645\u0646 \u0631\u0627\u0628\u0637 \u0627\u0644\u0648\u0633\u064a\u0637 \u0641\u064a \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a\u060c \u062b\u0645 \u0627\u0636\u063a\u0637 \u00ab\u0631\u0628\u0637 \u0627\u0644\u0645\u0646\u0635\u0629\u00bb \u0645\u0631\u0629 \u0623\u062e\u0631\u0649.");
  }
  if (/unavailable in the U\.?S|restricted country|current ip|US-VA|Terms of Use|unavailable in your region|region is not supported/i.test(raw)) {
    return new Error("KuCoin \u0631\u0641\u0636 \u0627\u0644\u0631\u0628\u0637 \u0645\u0646 \u0647\u0630\u0647 \u0627\u0644\u0634\u0628\u0643\u0629/\u0627\u0644\u062f\u0648\u0644\u0629. \u0627\u0644\u0648\u0631\u0642\u064a \u064a\u0639\u0645\u0644. \u0627\u0644\u062d\u064a \u064a\u062d\u062a\u0627\u062c \u0634\u0628\u0643\u0629 \u063a\u064a\u0631 \u0645\u062d\u0638\u0648\u0631\u0629.");
  }
  return err instanceof Error ? err : new Error(raw || "\u0641\u0634\u0644 KuCoin");
}

function hasNativeHttp(){
  try {
    return Boolean(window.Capacitor && (window.Capacitor.Plugins?.CapacitorHttp || window.CapacitorHttp));
  } catch { return false; }
}

async function nativeRequest(url, method, headers, body){
  const Http = window.Capacitor.Plugins?.CapacitorHttp || window.CapacitorHttp;
  const opts = { url, method: method === "DELETE" ? "DELETE" : method, headers: { ...headers } };
  if (body !== undefined && body !== null && method !== "GET" && method !== "DELETE") {
    opts.data = body;
  }
  const res = await Http.request(opts);
  return { status: res.status, data: res.data };
}

/* \u0648\u0633\u064a\u0637 CORS \u0644\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0639\u0627\u0645\u0629 \u0641\u0642\u0637 \u2014 \u0623\u0633\u0639\u0627\u0631 \u0648\u0634\u0645\u0648\u0639 \u0648\u062f\u0641\u062a\u0631 \u062d\u0642\u064a\u0642\u064a \u062f\u0627\u062e\u0644 \u0627\u0644\u0645\u062a\u0635\u0641\u062d.
   \u0644\u0627 \u062a\u0645\u0631 \u0639\u0628\u0631\u0647 \u0623\u0628\u062f\u0627\u064b \u0637\u0644\u0628\u0627\u062a \u0645\u0648\u0642\u0639\u0629 \u0623\u0648 \u0645\u0641\u0627\u062a\u064a\u062d (\u062a\u064f\u0631\u0633\u0644 \u062f\u0627\u062e\u0644 APK \u0641\u0642\u0637) */
const PROXY_CACHE = new Map();
const PROXY_HOSTS = [
  (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
];
let proxyWorks = null;
let proxySkipUntil = 0;
async function proxyGet(url, timeoutMs){
  if (proxySkipUntil > Date.now()) return null;
  const hit = PROXY_CACHE.get(url);
  if (hit && Date.now() - hit.at < 2500) return hit.res;
  for (const mk of PROXY_HOSTS) {
    try {
      const res = await fetch(mk(url), { cache: "no-store", signal: AbortSignal.timeout(Math.min(timeoutMs || 4500, 4500)) });
      if (!res.ok) throw new Error("proxy " + res.status);
      const text = await res.text();
      const json = JSON.parse(text);
      if (json === null || json.code === undefined) throw new Error("bad proxy resp");
      const wrapped = { status: 200, text, json: () => Promise.resolve(json) };
      PROXY_CACHE.set(url, { at: Date.now(), res: wrapped });
      proxyWorks = true;
      proxySkipUntil = 0;
      return wrapped;
    } catch {}
  }
  proxySkipUntil = Date.now() + 45_000; // \u0643\u0644 \u0627\u0644\u0648\u0633\u0637\u0627\u0621 \u0645\u062a\u0639\u0637\u0644\u0648\u0646 \u2014 \u0631\u0627\u062d\u0629 \u0642\u0628\u0644 \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629 \u0645\u062c\u062f\u062f\u0627\u064b
  return null;
}

/* \u0648\u0633\u064a\u0637 \u0627\u0644\u0637\u0644\u0628\u0627\u062a \u0627\u0644\u0645\u0648\u0642\u0651\u0639\u0629 \u2014 \u064a\u0639\u0645\u0644 \u062f\u0627\u062e\u0644 \u0627\u0644\u0645\u062a\u0635\u0641\u062d/WebView \u0641\u0642\u0637 \u0644\u0623\u0646 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0645\u062d\u062c\u0648\u0628 (CORS). \u0627\u0644\u0623\u0648\u0644\u0648\u064a\u0629 \u0644\u0648\u0633\u064a\u0637\u0643 \u0627\u0644\u0634\u062e\u0635\u064a \u0645\u0646 \u062d\u0642\u0644 \u00ab\u0631\u0627\u0628\u0637 \u0627\u0644\u0648\u0633\u064a\u0637\u00bb. \u0627\u0644\u062a\u0648\u0642\u064a\u0639 \u064a\u064f\u062d\u0633\u0628 \u0645\u062d\u0644\u064a\u0627\u064b \u0648\u0627\u0644\u0633\u0631 \u0627\u0644\u0633\u0631\u064a \u0644\u0627 \u064a\u062e\u0631\u062c \u0645\u0646 \u062c\u0647\u0627\u0632\u0643. */
let relayWorks = false;
let relaySkipUntil = 0;
const relayDead = new Set();
const relayDeadAt = new Map();
function relayMakers(){
  const list = [];
  const custom = ((typeof App !== "undefined" && App.prefs && App.prefs.relay) || "").trim();
  if (custom) list.push((u) => custom + (custom.includes("?") ? "&" : "?") + u);
  list.push((u) => "https://corsproxy.io/?url=" + encodeURIComponent(u));
  list.push((u) => "https://test.cors.workers.dev/?" + u);
  return list;
}
async function relayRequest(url, method, headers, body, timeoutMs){
  if (relaySkipUntil > Date.now()) return null;
  const tmo = Math.min(Math.max(timeoutMs || 8000, 7000), 9000);
  const makers = relayMakers();
  for (let idx = 0; idx < makers.length; idx += 1) {
    if (relayDead.has(idx) && (relayDeadAt.get(idx) || 0) > Date.now() - 60_000) continue;
    try {
      const res = await fetch(makers[idx](url), { method, cache: "no-store", signal: AbortSignal.timeout(tmo), headers, body: body || undefined });
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch {}
      if (json === null) { relayDead.add(idx); relayDeadAt.set(idx, Date.now()); continue; } // \u0631\u062f \u063a\u064a\u0631 \u0635\u0627\u0644\u062d \u2014 \u0648\u0633\u064a\u0637 \u0645\u0639\u0637\u0651\u0644\u060c \u062a\u062c\u0627\u0648\u0632\u0647
      if (json.code === undefined) { relayDead.add(idx); relayDeadAt.set(idx, Date.now()); continue; } // \u0631\u062f \u0645\u0646 \u0627\u0644\u0648\u0633\u064a\u0637 \u0648\u0644\u064a\u0633 \u0645\u0646 KuCoin \u2014 \u062c\u0631\u0651\u0628 \u0627\u0644\u0648\u0633\u064a\u0637 \u0627\u0644\u062a\u0627\u0644\u064a
      relayWorks = true;
      relaySkipUntil = 0;
      return { status: res.status, text, json: () => Promise.resolve(json) };
    } catch { relayDead.add(idx); relayDeadAt.set(idx, Date.now()); }
  }
  if (relayDead.size >= makers.length) relayDead.clear();
  relaySkipUntil = Date.now() + 30_000;
  return null;
}

async function rawRequest(url, method, headers, body, timeoutMs){
  if (hasNativeHttp()) {
    try {
      const r = await nativeRequest(url, method, headers, body);
      return { status: r.status, text: "", json: () => Promise.resolve(r.data) };
    } catch (err) {
      throw readableKc(err);
    }
  }
  let directErr = null;
  /* v1.5: \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0645\u0639 KuCoin \u0623\u0648\u0644\u0627\u064b \u062f\u0627\u0626\u0645\u064b\u0627 \u2014 \u0644\u0644\u0639\u0627\u0645 \u0648\u0627\u0644\u062e\u0627\u0635 \u0645\u0639\u0627\u064b \u0639\u0628\u0631 \u0627\u0646\u062a\u0631\u0646\u062a \u0627\u0644\u062c\u0647\u0627\u0632 \u0645\u0628\u0627\u0634\u0631\u0629. \u0627\u0644\u0648\u0633\u0637\u0627\u0621 \u0631\u062f\u064a\u0641 \u0635\u0627\u0645\u062a \u064a\u064f\u0633\u062a\u062e\u062f\u0645 \u0641\u0642\u0637 \u0625\u0630\u0627 \u0641\u0634\u0644 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0641\u0639\u0644\u064a\u0627\u064b \u2014 \u0644\u0627 \u064a\u0645\u0631 \u0623\u064a \u0637\u0644\u0628 \u0645\u0627 \u062f\u0627\u0645 \u0627\u0644\u0645\u0628\u0627\u0634\u0631 \u0646\u0627\u062c\u062d */
  try {
    const res = await fetch(url, {
      method,
      cache: "no-store",
      signal: AbortSignal.timeout(timeoutMs || 5000),
      headers,
      body: body || undefined,
    });
    return res;
  } catch (err) {
    directErr = err;
  }
  const r = await relayRequest(url, method, headers, body, timeoutMs).catch(() => null);
  if (r) return r;
  if (method === "GET" && !body) {
    const p = await proxyGet(url, timeoutMs).catch(() => null);
    if (p) return p;
  }
  throw directErr || new Error("Failed to fetch");
}

async function hmacB64(secret, payload){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"],
  );
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(payload));
  const bytes = new Uint8Array(sig);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function kcPublic(path, timeoutMs = 3200, method = "GET", body){
  let last;
  for (let i = 0; i < 3; i += 1) {
    try {
      const res = await rawRequest(`${FUTURES}${path}`, method, { "Content-Type": "application/json" }, body === undefined ? undefined : JSON.stringify(body), timeoutMs);
      if (res.status === 429 || res.status >= 500) throw new Error(`KuCoin ${res.status}`);
      if (res.status !== 200) {
        if (res.status === 0 || res.status === undefined) networkBlocked = true;
        throw new Error(`KuCoin ${res.status}`);
      }
      const jres = await res.json();
      const body_ = typeof jres === "string" ? JSON.parse(jres) : jres;
      if (body_.code !== "200000") throw new Error(body_.msg || body_.code);
      kcFailStreak = 0;
      networkBlocked = false;
      return body_.data;
    } catch (err) {
      last = readableKc(err);
      if (!isTransient(err) || i === 2) throw last;
      await sleep(180 * (i + 1));
    }
  }
  throw last;
}

async function kcPrivate(keys, method, path, body){
  let last;
  for (let i = 0; i < 2; i += 1) {
    try {
      const ts = Date.now().toString();
      const raw = body === undefined ? "" : JSON.stringify(body);
      const strToSign = ts + method + path + raw;
      const passphrase = await hmacB64(keys.apiSecret, keys.passphrase);
      const signature = await hmacB64(keys.apiSecret, strToSign);
      const res = await rawRequest(`${FUTURES}${path}`, method, {
        "Content-Type": "application/json",
        "KC-API-KEY": keys.apiKey,
        "KC-API-SIGN": signature,
        "KC-API-TIMESTAMP": ts,
        "KC-API-PASSPHRASE": passphrase,
        "KC-API-KEY-VERSION": "2",
      }, raw === "" ? undefined : raw, 6000);
      if (res.status === 429 || res.status >= 500) throw new Error(`KuCoin ${res.status}`);
      if (res.status !== 200) {
        let extra = "";
        try { const jerr = await res.json(); if (jerr && jerr.msg) extra = ": " + jerr.msg; } catch {}
        throw new Error("KuCoin " + res.status + extra);
      }
      const jres = await res.json();
      const jbody = typeof jres === "string" ? JSON.parse(jres) : jres;
      if (jbody.code !== "200000") throw new Error(jbody.msg || jbody.code);
      return jbody.data;
    } catch (err) {
      last = readableKc(err);
      if (!isTransient(err) || i === 1) throw last;
      await sleep(220);
    }
  }
  throw last;
}

function normalizeFeeRate(raw, fallback){
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0) return fallback;
  if (n === 0) return fallback;
  if (n >= 0.05) return n / 100;
  return n;
}

async function fetchContractMeta(symbol){
  const hit = contractMetaCache.get(symbol);
  if (hit && Date.now() - hit.at < 300_000) return hit.data;
  const contract = await kcPublic(`/api/v1/contracts/${encodeURIComponent(symbol)}`);
  const data = {
    multiplier: num(contract.multiplier, 1),
    tickSize: num(contract.tickSize, 1e-10) || 1e-10,
    makerFee: normalizeFeeRate(contract.makerFeeRate ?? contract.makerFeeCoefficient, 0.00004),
    takerFee: normalizeFeeRate(contract.takerFeeRate ?? contract.takerFeeCoefficient, 0.0002),
    funding: num(contract.fundingFeeRate, 0),
    markPrice: num(contract.markPrice, 0),
    maintMargin: num(contract.maintainMargin ?? contract.maintMarginReq, 0.004) || 0.004,
  };
  contractMetaCache.set(symbol, { at: Date.now(), data });
  return data;
}

function parseBookSide(rows, sliceTo = 16){
  if (!Array.isArray(rows)) return [];
  const out = [];
  for (const row of rows) {
    const pair = Array.isArray(row) ? row : null;
    if (!pair || pair.length < 2) continue;
    const price = num(pair[0]);
    const size = num(pair[1]);
    if (price > 0 && size > 0) out.push({ price, size });
  }
  return out.slice(0, sliceTo);
}

function parseTape(trades){
  return trades.slice(0, 32).map((t) => ({
    side: String(t.side || ""),
    size: num(t.size),
    price: num(t.price),
    ts: num(t.ts, Date.now()),
  }));
}

function parseKlines(raw){
  if (!Array.isArray(raw)) return [];
  const out = [];
  for (const row of raw) {
    if (!Array.isArray(row) || row.length < 5) continue;
    const tRaw = Number(row[0]);
    const o = num(row[1]);
    const h = num(row[2]);
    const l = num(row[3]);
    const c = num(row[4]);
    const v = num(row[5]);
    if (!Number.isFinite(tRaw) || o <= 0 || h <= 0 || l <= 0 || c <= 0) continue;
    out.push({ t: tRaw < 1e12 ? Math.round(tRaw * 1000) : tRaw, o, h, l, c, v });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}

function klineTtlMs(granularity){
  if (granularity <= 1) return 1600;
  if (granularity <= 5) return 2800;
  return 4500;
}

async function fetchKlines(symbol, granularity = 1){
  const g = KLINE_GRAN.has(granularity) ? granularity : 1;
  const key = `${symbol}:${g}`;
  const now = Date.now();
  const hit = klineCache.get(key);
  if (hit && now - hit.at < 30_000) return hit.bars;
  const pending = klineInflight.get(key);
  if (pending) return pending;
  const job = (async () => {
    const raw = await kcPublic(`/api/v1/kline/query?symbol=${encodeURIComponent(symbol)}&granularity=${g}&from=${Math.floor((Date.now() - 240 * 60_000) / 1000)}&to=${Math.floor(Date.now() / 1000)}`, 4500);
    const bars = parseKlines(raw);
    klineCache.set(key, { at: Date.now(), bars });
    return bars;
  })().finally(() => klineInflight.delete(key));
  klineInflight.set(key, job);
  return job;
}

async function fetchOrderBook(symbol){
  const snap = await kcPublic(`/api/v1/level2/depth20?symbol=${encodeURIComponent(symbol)}`).catch(() => null);
  if (!snap) return { bids: [], asks: [] };
  return { bids: parseBookSide(snap.bids), asks: parseBookSide(snap.asks) };
}

async function pingKeys(keys){
  const account = await kcPrivate(keys, "GET", `/api/v1/account-overview?currency=USDT`);
  return { ok: true, equity: account.accountEquity === undefined ? null : Number(account.accountEquity) };
}

async function placeOrders(keys, intents){
  return Promise.all(
    intents.map(async (intent) => {
      try {
        const data = await kcPrivate(keys, "POST", "/api/v1/orders", {
          clientOid: intent.clientOid,
          symbol: intent.symbol,
          side: intent.side,
          type: "limit",
          price: String(intent.price),
          size: intent.qty,
          leverage: String(intent.leverage),
          timeInForce: "GTC",
          reduceOnly: intent.reduceOnly,
          marginMode: "ISOLATED",
        });
        return { clientOid: intent.clientOid, orderId: data.orderId };
      } catch (err) {
        return { clientOid: intent.clientOid, orderId: null, error: err instanceof Error ? err.message : "order failed" };
      }
    }),
  );
}

async function searchActiveContracts(query){
  const now = Date.now();
  if (!contractCache || now - contractCache.at > 60_000) {
    const raw = await kcPublic("/api/v1/contracts/active");
    const rows = [];
    for (const c of raw) {
      if (c.status && c.status !== "Open") continue;
      if (c.isInverse) continue;
      const symbol = String(c.symbol || "");
      if (!symbol.endsWith("USDTM")) continue;
      const display = String(c.baseCurrency || symbol.replace(/USDTM$/, ""));
      rows.push({
        symbol,
        display,
        price: Number(c.lastTradePrice || c.markPrice || 0),
        mark: Number(c.markPrice || 0),
        funding: Number(c.fundingFeeRate || 0),
        volume: Number(c.turnoverOf24h || c.volumeOf24h || 0),
      });
    }
    rows.sort((a, b) => b.volume - a.volume);
    contractCache = { at: now, rows };
  }
  const q = query.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const list = contractCache.rows;
  if (!q) return list.slice(0, 24);
  const aliases = q === "BTC" ? ["BTC", "XBT"] : [q];
  return list
    .filter((r) => aliases.some((a) => r.display.includes(a) || r.symbol.includes(a)))
    .slice(0, 40);
}

/* ---------- WebSocket \u0627\u0644\u062d\u064a \u2014 \u0646\u0628\u0636 24/7 ---------- */
const WS = {
  socket: null,
  token: null,
  endpoint: null,
  symbol: null,
  connected: false,
  lastMsgAt: 0,
  pingTimer: null,
  retryTimer: null,
  backoff: 1000,
  price: 0,
  markPrice: 0,
  bestBid: 0,
  bestAsk: 0,
  book: { bids: [], asks: [] },
  tape: [],
  cvdAccum: 0,
};

async function wsConnect(symbol){
  if (WS.symbol === symbol && WS.connected) return;
  WS.symbol = symbol;
  try {
    const bullet = await kcPublic("/api/v1/bullet-public", 5000, "POST", {});
    WS.token = bullet.token;
    const server = (bullet.servers || [])[0] || { endpoint: "wss://ws-fkucoin.com/endpoint" };
    WS.endpoint = server.endpoint;
  } catch (err) {
    networkBlocked = networkBlocked || !hasNativeHttp();
    // \u0625\u0639\u0627\u062f\u0629 \u0645\u062d\u0627\u0648\u0644\u0629 \u062a\u0644\u0642\u0627\u0626\u064a\u0629 \u0628\u0639\u062f \u062a\u0631\u0627\u062c\u0639
    WS.backoff = Math.min((WS.backoff || 1000) * 1.8, 30000);
    setTimeout(() => { if (WS.symbol === symbol && !WS.connected) wsConnect(symbol); }, WS.backoff);
    return;
  }
  if (WS.socket) { try { WS.socket.close(); } catch {} }
  const url = `${WS.endpoint}?token=${WS.token}&acceptUserMessage=true`;
  let sock;
  try {
    sock = new WebSocket(url);
  } catch { return; }
  WS.socket = sock;

  sock.onopen = () => {
    WS.connected = true;
    WS.backoff = 1000;
    const sub = (topic, id) => sock.send(JSON.stringify({ id, type: "subscribe", topic, response: true, privateChannel: false }));
    sub(`/contractMarket/ticker:${symbol}`, 1);
    sub(`/contractMarket/level2Depth5:${symbol}`, 2);
    sub(`/contractMarket/execution:${symbol}`, 3);
    if (WS.pingTimer) clearInterval(WS.pingTimer);
    WS.pingTimer = setInterval(() => {
      try { sock.send(JSON.stringify({ id: Date.now() % 100000, type: "ping" })); } catch {}
    }, 27000);
  };
  sock.onmessage = (ev) => {
    WS.lastMsgAt = Date.now();
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "pong" || m.type === "welcome" || m.type === "ack") return;
    const topic = m.topic || "";
    const d = m.data || {};
    if (topic.startsWith("/contractMarket/ticker")) {
      WS.price = num(d.price, WS.price) || WS.price;
      WS.markPrice = num(d.markPrice, WS.markPrice) || WS.markPrice;
      WS.bestBid = num(d.bestBidPrice, WS.bestBid);
      WS.bestAsk = num(d.bestAskPrice, WS.bestAsk);
      if (WS.price > 0) pushLivePrice(WS.price);
    } else if (topic.startsWith("/contractMarket/level2Depth5") || topic.startsWith("/contractMarket/level2Depth50")) {
      const asks = parseBookSide(d.asks, d.asks && d.asks.length > 6 ? 16 : 6).slice(0, 16);
      const bids = parseBookSide(d.bids, d.bids && d.bids.length > 6 ? 16 : 6).slice(0, 16);
      if (asks.length) WS.book.asks = asks.sort((a, b) => a.price - b.price).slice(0, 16);
      if (bids.length) WS.book.bids = bids.sort((a, b) => b.price - a.price).slice(0, 16);
    } else if (topic.startsWith("/contractMarket/execution")) {
      const row = { side: d.side === "sell" ? "sell" : "buy", size: num(d.size), price: num(d.price), ts: num(d.ts, Date.now()) };
      WS.tape = [row, ...WS.tape].slice(0, 32);
      WS.cvdAccum += row.side === "buy" ? row.size : -row.size;
    }
  };
  const onGone = () => {
    WS.connected = false;
    if (WS.socket === sock) WS.socket = null;
    if (WS.symbol !== symbol) return; // \u062a\u063a\u064a\u0651\u0631 \u0627\u0644\u0632\u0648\u062c \u2014 \u0633\u064a\u062a\u0635\u0644 \u0645\u0646 \u062c\u062f\u064a\u062f
    if (WS.retryTimer) clearTimeout(WS.retryTimer);
    WS.backoff = Math.min(WS.backoff * 1.8, 30000);
    WS.retryTimer = setTimeout(() => wsConnect(symbol), WS.backoff);
  };
  sock.onclose = onGone;
  sock.onerror = () => {};
}

/* ---------- \u0628\u0646\u0627\u0621 \u0644\u0642\u0637\u0629 \u0627\u0644\u0633\u0648\u0642 \u0644\u0644\u0646\u0628\u0636\u0629 ---------- */
async function marketFor(symbol, extras = true){
  const meta = await fetchContractMeta(symbol).catch(() => null);
  const base = {
    price: 0, markPrice: 0, cvdDelta: 0,
    makerFee: meta?.makerFee ?? 0.00004,
    takerFee: meta?.takerFee ?? 0.0002,
    funding: meta?.funding ?? 0,
    multiplier: meta?.multiplier ?? 520000,
    tickSize: meta?.tickSize ?? 1e-10,
    orderBook: { bids: [], asks: [] },
    tape: [],
    maintMargin: meta?.maintMargin ?? 0.004,
    ts: Date.now(),
  };

  if (WS.connected && WS.symbol === symbol && WS.price > 0) {
    base.price = WS.price;
    base.markPrice = WS.markPrice || meta?.markPrice || WS.price;
    base.orderBook = WS.book;
    base.tape = WS.tape;
    base.cvdDelta = WS.cvdAccum;
    WS.cvdAccum = 0;
    if (extras) return base;
    return base;
  }

  // \u0627\u062d\u062a\u064a\u0627\u0637 REST \u0639\u0646\u062f \u0627\u0646\u0642\u0637\u0627\u0639 \u0627\u0644\u0648\u064a\u0628 \u0633\u0648\u0643\u064a\u062a
  const cached = marketCache.get(symbol);
  const fresh = cached && Date.now() - cached.at < 220;
  if (fresh) return cached.data;
  const data = await (async () => {
    const m = { ...base };
    const [ticker, ex] = await Promise.all([
      kcPublic(`/api/v1/ticker?symbol=${encodeURIComponent(symbol)}`, 1600).catch(() => null),
      (async () => {
        const [trades, book] = await Promise.all([
          kcPublic(`/api/v1/trade/history?symbol=${encodeURIComponent(symbol)}`, 2000).catch(() => []),
          fetchOrderBook(symbol),
        ]);
        const tape = parseTape(trades);
        let cvdDelta = 0;
        for (const t of tape) cvdDelta += t.side === "buy" ? t.size : -t.size;
        return { orderBook: book, tape, cvdDelta };
      })().catch(() => ({ orderBook: { bids: [], asks: [] }, tape: [], cvdDelta: 0 })),
    ]);
    m.price = num(ticker?.price, meta?.markPrice || 0);
    m.markPrice = meta?.markPrice || m.price;
    m.orderBook = ex.orderBook;
    m.tape = ex.tape;
    m.cvdDelta = ex.cvdDelta;
    return m;
  })();
  marketCache.set(symbol, { at: Date.now(), data });
  return data;
}

async function fetchExchangeSnap(keys, symbol){
  const market = await marketFor(symbol);
  let positionOk = true;
  let ordersOk = true;
  const [posRaw, ordersRaw, account] = await Promise.all([
    kcPrivate(keys, "GET", `/api/v1/position?symbol=${encodeURIComponent(symbol)}`).catch((err) => {
      positionOk = false;
      if (!isTransient(err)) console.error("[kucoin] position", err);
      return null;
    }),
    kcPrivate(keys, "GET", `/api/v1/orders?status=active&symbol=${encodeURIComponent(symbol)}`).catch((err) => {
      ordersOk = false;
      if (!isTransient(err)) console.error("[kucoin] orders", err);
      return { items: [] };
    }),
    kcPrivate(keys, "GET", `/api/v1/account-overview?currency=USDT`).catch(() => null),
  ]);
  const pos = Array.isArray(posRaw) ? posRaw[0] : posRaw;
  const qty = pos ? Number(pos.currentQty) || 0 : 0;
  let position = null;
  if (qty !== 0 && pos) {
    position = {
      side: qty < 0 ? "short" : "long",
      size: Math.abs(qty),
      entry: Number(pos.avgEntryPrice) || market.price,
      leverage: Number(pos.leverage) || 1,
      unrealized: Number(pos.unrealisedPnl) || 0,
      openedAt: Date.now(),
      liquidation: Number(pos.liquidationPrice) || null,
    };
  }
  const openOrders = (Array.isArray(ordersRaw) ? ordersRaw : ordersRaw?.items ?? []).map((o) => ({
    orderId: o.id,
    clientOid: o.clientOid ?? null,
    side: o.side === "sell" ? "sell" : "buy",
    price: Number(o.price),
    size: Number(o.size),
    reduceOnly: Boolean(o.reduceOnly),
  }));
  const balanceRaw = account?.accountEquity ?? account?.availableBalance;
  const mmr = pos ? Number(pos.maintMarginReq ?? pos.maintainMargin) || market.maintMargin : market.maintMargin;
  const liq = pos ? Number(pos.liquidationPrice) || null : null;
  return {
    price: market.price,
    markPrice: market.markPrice,
    balance: balanceRaw === undefined ? null : Number(balanceRaw),
    position,
    openOrders,
    makerFee: market.makerFee,
    takerFee: market.takerFee,
    funding: market.funding,
    multiplier: market.multiplier,
    tickSize: market.tickSize,
    orderBook: market.orderBook,
    tape: market.tape,
    liquidationPrice: liq,
    maintMarginRate: mmr,
    positionOk,
    ordersOk,
  };
}

/* ============================================================
   \u062d\u0641\u0638 \u0627\u0644\u062d\u0627\u0644\u0629 \u0648\u0627\u0644\u0645\u0641\u0627\u062a\u064a\u062d \u2014 \u0642\u0627\u0639\u062f\u0629 \u0645\u062d\u0644\u064a\u0629 \u062f\u0627\u0626\u0645\u0629 (localStorage)
   ============================================================ */
const LS_STATE = "trq:state:abtr:ab-desk";
const LS_KEYS = "trq:keys:ab-desk";
const LS_PREFS = "trq:prefs";

/* \u062a\u062e\u0632\u064a\u0646 \u0622\u0645\u0646 \u2014 \u062d\u062a\u0649 \u0644\u0648 \u062d\u064f\u062c\u0628 localStorage (\u0625\u0637\u0627\u0631 \u0645\u0639\u0627\u064a\u0646\u0629 \u0645\u0639\u0632\u0648\u0644) \u062a\u0639\u0645\u0644 \u0627\u0644\u062d\u0627\u0644\u0629 \u062f\u0627\u062e\u0644 \u0627\u0644\u0630\u0627\u0643\u0631\u0629
   \u0641\u0644\u0627 \u062a\u0636\u0628\u0637 \u0625\u0639\u062f\u0627\u062f\u0627\u062a\u0643 \u0648\u0644\u0627 \u064a\u062a\u0648\u0642\u0641 \u0627\u0644\u0628\u0648\u062a \u0628\u0639\u062f \u0643\u0644 \u0646\u0628\u0636\u0629 */
const memKV = new Map();
function lsGet(key){
  try {
    const v = localStorage.getItem(key);
    if (v !== null) return v;
  } catch {}
  return memKV.has(key) ? memKV.get(key) : null;
}
function lsSet(key, val){
  try { localStorage.setItem(key, val); } catch {}
  try { memKV.set(key, val); } catch {}
}
function lsDel(key){
  try { localStorage.removeItem(key); } catch {}
  try { memKV.delete(key); } catch {}
}

function parseState(raw){
  const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
  return hydrateState(parsed);
}

function loadState(userId = "abtr:ab-desk"){
  try {
    const raw = lsGet(LS_STATE);
    if (!raw) return createIdleState({ edition: "trading" });
    const state = parseState(raw);
    state.config.edition = "trading";
    return state;
  } catch {
    return createIdleState({ edition: "trading" });
  }
}

function saveState(userId, next, command){
  let prev = null;
  try {
    const rawPrev = lsGet(LS_STATE);
    prev = rawPrev ? parseState(rawPrev) : null;
  } catch { prev = null; }
  const nextRev = next.rev ?? 0;
  const prevRev = prev?.rev ?? 0;
  if (TICK_COMMANDS.has(command) && prev && prevRev > nextRev) {
    return prev;
  }
  if (!TICK_COMMANDS.has(command)) {
    next.rev = prevRev + 1;
  } else {
    next.rev = nextRev || prevRev;
  }
  assertDurable(prev, next, command);
  try {
    lsSet(LS_STATE, JSON.stringify(cloneState(next)));
  } catch (e) {
    console.error("save failed", e);
  }
  return next;
}

function saveKeys(userId, keys){
  try {
    lsSet(LS_KEYS, JSON.stringify(keys));
  } catch {}
}

function loadKeys(userId){
  try {
    const raw = lsGet(LS_KEYS);
    if (!raw) return null;
    const k = JSON.parse(raw);
    if (!k.apiKey || !k.apiSecret || !k.passphrase) return null;
    return k;
  } catch { return null; }
}

function deleteKeys(userId){
  lsDel(LS_KEYS);
}

function keyHintOf(keys){
  if (!keys?.apiKey) return null;
  return keys.apiKey.slice(-4);
}

function loadPrefs(){
  try { return JSON.parse(lsGet(LS_PREFS) || "{}") || {}; } catch { return {}; }
}
function savePrefs(p){
  try { lsSet(LS_PREFS, JSON.stringify(p)); } catch {}
}

/* ============================================================
   \u0646\u0628\u0636 \u0627\u0644\u062a\u0634\u063a\u064a\u0644 \u2014 \u0627\u0644\u0645\u0642\u0627\u0628\u0644 \u0644\u0640 runtime.server.ts
   \u064a\u0648\u0642\u0638 \u0643\u0644 \u062b\u0627\u0646\u064a\u0629: \u0648\u0631\u0642\u064a \u064a\u062d\u0633\u0628 \u0645\u062d\u0644\u064a\u0627\u064b\u060c \u062d\u064a \u064a\u0632\u0627\u0645\u0646 \u0645\u0639 \u0627\u0644\u0645\u0646\u0635\u0629
   ============================================================ */
let __tickN = 0;
let __ticking = false;
let runtimeTimer = null;
let PULSE_MS = 1000;

function tickCount(){ __tickN += 1; return __tickN; }

function credentialsUserId(userId){
  return userId.startsWith(TRADING_TENANT) ? userId.slice(TRADING_TENANT.length) : userId;
}

async function placeArmed(state, keys){
  const intents = pendingPlaceIntents(state);
  if (intents.length === 0) return state;
  if (state.config.mode !== "live" || !keys) {
    return markLevelsOpen(
      state,
      intents.map((i) => ({ clientOid: i.clientOid, orderId: `paper_${i.clientOid}` })),
    );
  }
  const placed = await placeOrders(keys, intents);
  return markLevelsOpen(state, placed);
}

async function cancelLiveOrders(userId, symbol){
  const keys = loadKeys(credentialsUserId(userId));
  if (!keys) return;
  await cancelAllOrders(keys, symbol);
}

async function flattenLive(userId, symbol, side){
  const keys = loadKeys(credentialsUserId(userId));
  if (!keys) return;
  await cancelAllOrders(keys, symbol);
  if (side) {
    await closeMarketPosition(keys, symbol, side).catch((err) => {
      console.error("[trq] close position", err);
    });
  }
}

async function tickUser(userId){
  if (__ticking) return loadState(userId);
  __ticking = true;
  try {
    return await tickUserLocked(userId);
  } finally {
    __ticking = false;
  }
}

async function tickUserLocked(userId){
  let state = loadState(userId);
  const revAtStart = state.rev ?? 0;
  const credId = credentialsUserId(userId);
  const keys = loadKeys(credId);
  state.hasKeys = Boolean(keys);
  state.keyHint = keys ? keys.apiKey.slice(-4) : null;

  const persist = (next, command) => {
    const latest = loadState(userId);
    if ((latest.rev ?? 0) > revAtStart) return latest;
    next.rev = revAtStart;
    return saveState(userId, next, command);
  };

  if (state.status !== "running" && state.status !== "paused") {
    try {
      const market = await marketFor(state.config.symbol, false);
      if (!market.price || market.price <= 0) throw new Error("\u0644\u0627 \u0633\u0639\u0631");
      state = tickPaper(state, market);
      state.hasKeys = Boolean(keys);
      state.keyHint = keys ? keys.apiKey.slice(-4) : null;
      return persist(state, "idle-quote");
    } catch {
      state.lastServerTickAt = Date.now();
      return state;
    }
  }

  try {
    if (state.config.mode === "live" && keys) {
      const ex = await fetchExchangeSnap(keys, state.config.symbol);
      const latestLive = loadState(userId);
      if ((latestLive.rev ?? 0) > revAtStart) return latestLive;
      if (latestLive.config.symbol !== state.config.symbol) return latestLive;
      state = reconcileWithExchange(state, ex);
      if (state.status === "running" || state.status === "paused") {
        const liveSide = state.position?.side ?? null;
        const trading = isTradingEdition(state);
        const hadPos = Boolean(state.position);
        if (state.status === "running" && !trading) {
          const hunt = pendingHunt(state, ex.price);
          if (hunt) {
            let placed = false;
            try {
              await placeMarketOrder(keys, {
                symbol: state.config.symbol,
                side: hunt.side,
                qty: hunt.qty,
                leverage: state.config.leverage,
              });
              placed = true;
            } catch (err) {
              state.lastError = err instanceof Error ? err.message : "\u0641\u0634\u0644 \u0635\u064a\u062f \u0627\u0644\u0633\u0648\u0642";
            }
            if (placed) state = maybeHunt(state, ex.price);
          }
          state.heartbeat += 1;
          state.workers = 1;
        } else if (state.status === "running" && trading) {
          state.heartbeat += 1;
          state.workers = 1;
        } else {
          state.workers = 0;
          state.hunting = false;
        }
        state = applyCrossedFills(state, ex.price);
        if (trading && hadPos && !state.position && liveSide && ex.positionOk !== false) {
          await flattenLive(credId, state.config.symbol, liveSide);
        }
        if (state.status === "running" && trading) {
          const hunt = pendingHunt(state, ex.price);
          if (hunt) {
            let placed = false;
            try {
              await placeMarketOrder(keys, {
                symbol: state.config.symbol,
                side: hunt.side,
                qty: hunt.qty,
                leverage: state.config.leverage,
              });
              placed = true;
            } catch (err) {
              state.lastError = err instanceof Error ? err.message : "\u0641\u0634\u0644 \u0635\u064a\u062f \u0627\u0644\u0633\u0648\u0642";
            }
            if (placed) state = maybeHunt(state, ex.price);
          }
        }
        if (state.status === "running") {
          state = ensureGrid(state);
          const liveAdds = (ex.openOrders ?? []).some((o) => !o.reduceOnly);
          const localAdds = state.grid.some((g) => !g.reduceOnly && (g.status === "open" || g.status === "armed"));
          if (trading && liveAdds && !localAdds) {
            const heldAgo = state.addsHeldAt ? Date.now() - state.addsHeldAt : 99999;
            if (heldAgo > 20_000) {
              await cancelAllOrders(keys, state.config.symbol).catch(() => undefined);
              state.addsHeldAt = Date.now();
            }
          }
        }
        state = await placeArmed(state, keys);
      }
      return persist(state, "live-tick");
    }

    const market = await marketFor(state.config.symbol, tickCount() % 2 === 0);
    const latestPaper = loadState(userId);
    if ((latestPaper.rev ?? 0) > revAtStart) return latestPaper;
    if (latestPaper.config.symbol !== state.config.symbol) return latestPaper;
    if (state.status === "paused") {
      state = tickPaper(state, market);
      state.status = "paused";
      state.workers = 0;
      return persist(state, "pause-quote");
    }
    state = tickPaper(state, market);
    state.hasKeys = Boolean(keys);
    state.keyHint = keys ? keys.apiKey.slice(-4) : null;
    return persist(state, "paper-tick");
  } catch (err) {
    const msg = err instanceof Error ? err.message : "tick failed";
    state.lastServerTickAt = Date.now();
    if (isTransient(err) || /aborted|timeout|429|503|502|500/i.test(msg)) {
      state.connected = state.lastPrice != null;
      state.lastError = null;
      return persist(state, "tick-retry");
    }
    state.lastError = null;
    return persist(state, "tick-retry");
  }
}

function ensureBotRuntime(){
  if (runtimeTimer) return;
  runtimeTimer = setInterval(() => {
    tickUser("abtr:ab-desk").then((state) => {
      App.state = state;
      if (state.lastPrice) {
        App.lastSnapAt = Date.now();
        pushLivePrice(state.lastPrice);
      }
      // \u0623\u0645\u0627\u0646: \u0644\u0627 \u0628\u064a\u0627\u0646\u0627\u062a \u062d\u064a\u0629 \u0648\u0644\u0627 \u0645\u062d\u0627\u0643\u0627\u0629 \u0645\u0646\u0630 12 \u062b\u0627\u0646\u064a\u0629 \u2192 \u0641\u0639\u0651\u0644 \u0627\u0644\u0645\u062d\u0627\u0643\u0627\u0629 \u0627\u0644\u062a\u0648\u0636\u064a\u062d\u064a\u0629
      if (!demoTimer && !WS.connected && !hasNativeHttp() && !feedLiveRecently() && Date.now() - (App.lastSnapAt || 0) > 12000) startDemo();
      renderIfVisible();
      notifyFill(state);
    }).catch((err) => console.error("[trq] runtime", err));
  }, PULSE_MS);
}

/* ============================================================
   \u0627\u0644\u0623\u0632\u0631\u0627\u0631 \u2014 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0644\u0640 ab-trading-actions.ts
   ============================================================ */
async function actStartBot(config){
  const userId = "abtr:ab-desk";
  let state = loadState(userId);
  const keys = loadKeys(credentialsUserId(userId));
  const incoming = { ...clampConfig(config ?? state.config), edition: "trading" };
  if (state.status === "running") {
    state.config = { ...state.config, ...incoming, edition: "trading" };
    saveState(userId, state, "keep-running");
    return state;
  }
  if (incoming.mode === "live" && !keys) throw new Error("\u0627\u0631\u0628\u0637 \u0645\u0641\u0627\u062a\u064a\u062d KuCoin \u0642\u0628\u0644 \u0627\u0644\u062a\u0634\u063a\u064a\u0644 \u0627\u0644\u062d\u0642\u064a\u0642\u064a");
  state.config = { ...state.config, ...incoming, edition: "trading" };
  if (state.status === "paused" && state.position) {
    state = resumeBot(state);
    saveState(userId, state, "resume");
    return state;
  }
  let price = state.lastPrice || state.markPrice || WS.price;
  if (!price) {
    const m = await marketFor(state.config.symbol, false);
    price = m.price || WS.price;
  }
  if (!price) throw new Error("\u062a\u0639\u0630\u0631 \u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0633\u0639\u0631");
  state = startCycle(state, price, Boolean(state.position));
  saveState(userId, state, "start");
  return state;
}

async function actPause(){
  const userId = "abtr:ab-desk";
  const prev = loadState(userId);
  if (prev.config.mode === "live") {
    void cancelLiveOrders(userId, prev.config.symbol);
  }
  const state = pauseBot(prev);
  saveState(userId, state, "pause");
  return state;
}

async function actStop(){
  const userId = "abtr:ab-desk";
  const prev = loadState(userId);
  if (prev.config.mode === "live") {
    await flattenLive(userId, prev.config.symbol, prev.position?.side ?? null);
  }
  const state = stopBot(prev, prev.lastPrice);
  saveState(userId, state, "stop");
  return state;
}

async function actNewCycle(){
  const userId = "abtr:ab-desk";
  const prev = loadState(userId);
  if (prev.config.mode === "live") await cancelLiveOrders(userId, prev.config.symbol);
  const wasRunning = prev.status === "running" || prev.status === "paused";
  let fresh = resetForNewCycle(prev);
  fresh.config.edition = "trading";
  const price = prev.lastPrice || prev.markPrice;
  if (wasRunning && price) fresh = startCycle(fresh, price, false);
  saveState(userId, fresh, "reset-hard");
  return fresh;
}

async function actPatchConfig(patch){
  const userId = "abtr:ab-desk";
  const state = loadState(userId);
  const oldSymbol = state.config.symbol;
  const oldSide = state.position?.side ?? null;
  let next = applyLiveConfig(state, { ...patch, edition: "trading" });
  const switched = oldSymbol !== next.config.symbol;
  if (switched && state.config.mode === "live") {
    await cancelLiveOrders(userId, oldSymbol);
    if (oldSide) await flattenLive(userId, oldSymbol, oldSide);
  }
  if (switched && (state.status === "running" || state.status === "paused")) {
    try {
      await switchConnection(next.config.symbol);
      const m = await marketFor(next.config.symbol);
      next.lastPrice = m.price;
      next.markPrice = m.markPrice;
      next.multiplier = m.multiplier;
      next.tickSize = m.tickSize;
      if (m.price) next = startCycle(next, m.price, false);
    } catch {
      /* \u0627\u0644\u0646\u0628\u0636\u0629 \u0627\u0644\u062a\u0627\u0644\u064a\u0629 \u0633\u062a\u0633\u0639\u0651\u0631 \u0627\u0644\u0632\u0648\u062c \u0627\u0644\u062c\u062f\u064a\u062f */
    }
  }
  saveState(userId, next, "patch-config");
  return next;
}

async function actSaveKeys(input){
  const userId = "abtr:ab-desk";
  const apiKey = input.apiKey.trim();
  const apiSecret = input.apiSecret.trim();
  const passphrase = input.passphrase.trim();
  if (!apiKey || !apiSecret || !passphrase) throw new Error("\u0623\u062f\u062e\u0644 \u0627\u0644\u0645\u0641\u062a\u0627\u062d \u0648\u0627\u0644\u0633\u0631 \u0648\u0627\u0644\u0639\u0628\u0627\u0631\u0629");
  await pingKeys({ apiKey, apiSecret, passphrase });
  saveKeys(credentialsUserId(userId), { apiKey, apiSecret, passphrase });
  const state = loadState(userId);
  state.hasKeys = true;
  state.keyHint = apiKey.slice(-4);
  state.connected = true;
  state.lastError = null;
  state.config.edition = "trading";
  return saveState(userId, state, "save-keys");
}

async function actClearKeys(){
  const userId = "abtr:ab-desk";
  deleteKeys(credentialsUserId(userId));
  const state = loadState(userId);
  if (state.config.mode === "live" && state.status === "running") state.config.mode = "paper";
  state.hasKeys = false;
  state.keyHint = null;
  return saveState(userId, state, "clear-keys");
}

async function actCloseLot(lotId){
  const userId = "abtr:ab-desk";
  const prev = loadState(userId);
  const row = prev.journal.find((j) => j.id === lotId && j.status === "open");
  if (!row) return prev;
  const price = prev.markPrice || prev.lastPrice || row.entry;
  const state = closeLot(prev, lotId, price);
  saveState(userId, state, "close-lot");
  if (prev.config.mode === "live") {
    const keys = loadKeys(credentialsUserId(userId));
    if (keys) {
      await Promise.race([
        closeMarketQty(keys, prev.config.symbol, row.side, row.qty).catch(() => undefined),
        new Promise((r) => setTimeout(r, 2500)),
      ]);
    }
  }
  return loadState(userId);
}

function feedLiveRecently(){
  return (WS.lastMsgAt > Date.now() - 25000) || (lastPollAt > Date.now() - 25000);
}
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function startPolling(symbol){
  stopPolling();
  if (window.self !== window.top) return;
  pollTimer = setInterval(async () => {
    if (WS.connected && WS.lastMsgAt > Date.now() - 20000) return;
    const sym = symbol || WS.symbol || App.state?.config.symbol;
    if (!sym) return;
    try {
      const d = await kcPublic("/api/v1/contracts/" + sym, 7000);
      const px = num(d.lastTradePrice, 0);
      if (px > 0) {
        lastPollAt = Date.now();
        WS.price = px;
        WS.markPrice = num(d.markPrice, px) || px;
        if (demoTimer) { clearInterval(demoTimer); demoTimer = null; WS.connected = false; }
        pushLivePrice(px);
      }
    } catch {}
  }, 4000);
}

  } catch {}
}

function pushLivePrice(price){
  if (!chartBars.length) return;
  const last = chartBars[chartBars.length - 1];
  const tfMs = (App.prefs.tf || 1) * 60000;
  const minute = Math.floor(Date.now() / tfMs) * tfMs;
  if (last.t === minute) {
    last.c = price;
    last.h = Math.max(last.h, price);
    last.l = Math.min(last.l, price);
  } else if (minute > last.t) {
    chartBars.push({ t: minute, o: last.c, h: Math.max(last.c, price), l: Math.min(last.c, price), c: price, v: 0 });
    if (chartBars.length > 90) chartBars.shift();
  }
}

function signed(n, digits = 2){
  if (n == null || !Number.isFinite(n)) return "\u2014";
  const s = n > 0 ? "+" : "";
  return s + n.toFixed(digits);

function pnlClass(n){ return n > 0 ? "pos" : n < 0 ? "neg" : "mut"; }

function formatCvd(n){
  if (!Number.isFinite(n)) return "\u2014";
  const abs = Math.abs(n);
  if (abs >= 1e6) return signed(n / 1e6, 2) + "M";
  if (abs >= 1e3) return signed(n / 1e3, 1) + "K";
  return signed(n, 0);
}
function formatFeePct(f){
  if (!Number.isFinite(f) || f === 0) return "\u2014";
  return `${(f * 100).toFixed(4)}%`;
}

/* ---------- \u0627\u0644\u0635\u0648\u062a ---------- */
let audioCtx = null;
const TONES = {
  chime: [880, 1174.7],
  soft: [523.25, 659.25],
  rise: [659.25, 987.77],
};
function beep(toneId){
  if (!App.prefs.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = TONES[toneId] || TONES.chime;
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02 + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.34 + i * 0.12);
      o.connect(g).connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i * 0.12);
      o.stop(audioCtx.currentTime + 0.5 + i * 0.12);
    });
  } catch {}
}

function notifyFill(state){
  const fill = state.logs.find((l) => l.kind === "fill" && Date.now() - l.at < 12_000);
  if (fill && fill.id !== App.lastFillId) {
    App.lastFillId = fill.id;
    toast(fill.text);
    beep(App.prefs.tone || "chime");
    if (navigator.vibrate) try { navigator.vibrate(60); } catch {}
  }
}

/* ---------- \u0627\u0644\u0631\u0633\u0645: \u0627\u0644\u0634\u0645\u0648\u0639 ---------- */
function drawChart(){
  const canvas = $("chart");
  if (!canvas || !chartBars.length) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const bars = chartBars.slice(-60);
  const s = App.state;
  const marks = [];
  if (s.position?.entry) marks.push({ price: s.position.entry, color: "#e3b34c", dash: [5, 4], label: "\u0645\u062a\u0648\u0633\u0637 \u0627\u0644\u062f\u062e\u0648\u0644 " + fmtPx(s.position.entry) });
  const tpLevels = s.grid.filter((g) => g.reduceOnly && g.status === "open");
  if (tpLevels.length) {
    const tpAvg = tpLevels.reduce((a, g) => a + g.price, 0) / tpLevels.length;
    marks.push({ price: tpAvg, color: "#3ddc84", dash: [2, 4], label: "\u0645\u062a\u0648\u0633\u0637 \u0627\u0644\u062c\u0646\u064a " + fmtPx(tpAvg) });
  }
  const liq = s.liquidationPrice || s.position?.liquidation;
  if (liq) marks.push({ price: liq, color: "#ff5c5c", dash: [3, 4], label: "\u0633\u0639\u0631 \u0627\u0644\u062a\u0635\u0641\u064a\u0629 " + fmtPx(liq) });

  let hi = -Infinity, lo = Infinity;
  for (const b of bars) { hi = Math.max(hi, b.h); lo = Math.min(lo, b.l); }
  const rawRange = (hi - lo) || hi * 0.004 || 1;
  for (const m of marks) {
    if (!(m.price > 0)) continue;
    hi = Math.max(hi, Math.min(m.price, hi + rawRange * 1.5));
    lo = Math.min(lo, Math.max(m.price, lo - rawRange * 1.5));
  }
  if (!Number.isFinite(hi) || !Number.isFinite(lo) || hi <= lo) return;
  const pad = (hi - lo) * 0.06;
  hi += pad; lo -= pad;
  const L = 8, R = 52, T = 8, B = 16;
  const cw = w - L - R, ch = h - T - B;
  const yOf = (p) => T + ch - ((p - lo) / (hi - lo)) * ch;
  const bw = cw / bars.length;

  // \u0634\u0628\u0643\u0629 \u062e\u0641\u064a\u0641\u0629
  ctx.strokeStyle = "#1c251f";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = T + (ch / 4) * i;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + cw, y); ctx.stroke();
    const price = hi - ((hi - lo) / 4) * i;
    ctx.fillStyle = "#6b7d70";
    ctx.font = "9px ui-monospace, monospace";
    ctx.textAlign = "left";
    ctx.fillText(fmtPx(price), L + cw + 4, y + 3);
  }
  if (demoTimer) {
    ctx.fillStyle = "rgba(227,179,76,.14)";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("\u0645\u062d\u0627\u0643\u0627\u0629 \u062a\u0648\u0636\u064a\u062d\u064a\u0629", L + cw / 2, T + ch / 2);
  }

  bars.forEach((b, i) => {
    const x = L + i * bw + bw * 0.12;
    const bwid = bw * 0.72;
    const up = b.c >= b.o;
    ctx.fillStyle = up ? "#3ddc84" : "#ff5c5c";
    const yo = yOf(b.o), yc = yOf(b.c);
    ctx.fillRect(x, Math.min(yo, yc), bwid, Math.max(1.2, Math.abs(yc - yo)));
    ctx.strokeStyle = up ? "#3ddc84" : "#ff5c5c";
    ctx.beginPath();
    ctx.moveTo(x + bwid / 2, yOf(b.h));
    ctx.lineTo(x + bwid / 2, yOf(b.l));
    ctx.stroke();
  });

  // \u0627\u0644\u0633\u0639\u0631 \u0627\u0644\u062d\u0627\u0644\u064a
  const price = s.lastPrice || WS.price || bars[bars.length - 1].c;
  if (price > lo && price < hi) {
    const y = yOf(price);
    ctx.strokeStyle = "#e3b34c";
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + cw, y); ctx.stroke();
    ctx.fillStyle = "#e3b34c";
    ctx.fillRect(L + cw + 2, y - 8, R - 6, 16);
    ctx.fillStyle = "#0a0d0b";
    ctx.font = "bold 9px ui-monospace, monospace";
    ctx.textAlign = "left";
    ctx.fillText(fmtPx(price), L + cw + 5, y + 3);
  }

  // \u0639\u0644\u0627\u0645\u0627\u062a \u0627\u0644\u062f\u062e\u0648\u0644 \u0648\u0627\u0644\u062c\u0646\u064a \u0648\u0627\u0644\u062a\u0635\u0641\u064a\u0629 \u2014 \u062a\u064f\u0631\u0633\u0645 \u062f\u0627\u0626\u0645\u0627\u064b \u0648\u0644\u0648 \u062e\u0627\u0631\u062c \u0627\u0644\u0645\u062f\u0649 (\u0645\u062b\u0628\u062a\u0629 \u0639\u0644\u0649 \u0627\u0644\u062d\u0627\u0641\u0629)
  for (const m of marks) {
    let y = yOf(m.price);
    let label = m.label;
    if (!(m.price > lo && m.price < hi)) {
      y = m.price > hi ? T + 3 : T + ch - 3;
      label = (m.price > hi ? "\u25b2 " : "\u25bc ") + m.label;
    }
    ctx.strokeStyle = m.color;
    ctx.setLineDash(m.dash);
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + cw, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = m.color;
    ctx.font = "9px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(label, L + cw - 4, m.price > hi ? y + 10 : y - 3);
  }
}

/* ---------- \u0628\u0637\u0627\u0642\u0627\u062a ---------- */
function metaChip(l, v, gold){ return `<div class="chip"><div class="l">${esc(l)}</div><div class="v ${gold ? "gold" : ""}">${esc(v)}</div></div>`; }
function statCard(l, v, cls){ return `<div class="stat"><div class="l">${esc(l)}</div><div class="v ${cls || ""}">${esc(v)}</div></div>`; }

  <div class="card">
    <div class="grid3">
      ${metaChip("\u0631\u0635\u064a\u062f \u0627\u0644\u062f\u0648\u0631\u0629", "$" + equity.toFixed(2), true)}
      ${metaChip("\u0635\u0627\u0641\u064a \u0627\u0644\u0631\u0628\u062d", signed(netPnl), pnlClass(netPnl))}
      <div class="chip"><div class="l">\u0633\u0639\u0631 \u0627\u0644\u062a\u0635\u0641\u064a\u0629</div><div class="v ${liqClose ? "neg" : ""}">${liq ? fmtPx(liq) : "\u2014"}</div></div>
    </div>
    <div class="row mini" style="margin-top:8px">
      <span>KuCoin ${s.exchangeBalance === null ? "\u2014" : "$" + s.exchangeBalance.toFixed(2)}</span>
      <span>MMR ${(s.maintMarginRate * 100).toFixed(2)}% \u00b7 \u00d7${s.config.leverage}${dist !== null ? ` \u00b7 \u0628\u064f\u0639\u062f ${dist.toFixed(2)}\u066a` : ""}</span>
    </div>
    <div style="background:#0f1411aa;border-radius:12px;padding:10px;margin-top:8px">
      <p style="margin:0 0 6px;font-size:.72rem;font-weight:700">\u0627\u0644\u0635\u0641\u0642\u0627\u062a</p>
      <div class="grid3" style="text-align:center">
        <div><div class="v goldt" style="font-family:ui-monospace">${desk.winCount}</div><div class="mini">\u0646\u0627\u062c\u062d</div></div>
        <div><div class="neg" style="font-family:ui-monospace;font-weight:700">${desk.loseCount}</div><div class="mini">\u062e\u0627\u0633\u0631</div></div>
        <div><div class="warnt" style="font-family:ui-monospace;font-weight:700">${desk.hangingCount}</div><div class="mini">\u0645\u0639\u0644\u0651\u0642</div></div>
      </div>
      <div class="grid3" style="margin-top:8px;text-align:center">
        <div style="background:#0a0d0b66;border-radius:8px;padding:6px"><div style="font-family:ui-monospace;font-size:.7rem;font-weight:700" class="${pnlClass(desk.winPnl)}">${signed(desk.winPnl)}</div><div class="mini">\u0631\u0628\u062d \u0635\u0627\u0641\u064a</div></div>
        <div style="background:#0a0d0b66;border-radius:8px;padding:6px"><div style="font-family:ui-monospace;font-size:.7rem;font-weight:700" class="${pnlClass(desk.losePnl)}">${signed(desk.losePnl)}</div><div class="mini">\u062e\u0633\u0627\u0631\u0629</div></div>
        <div style="background:#0a0d0b66;border-radius:8px;padding:6px"><div style="font-family:ui-monospace;font-size:.7rem;font-weight:700" class="mut">${desk.feesPaid.toFixed(2)}$</div><div class="mini">\u0631\u0633\u0648\u0645</div></div>
      </div>
      <p class="mini" style="text-align:center;margin:6px 0 0">\u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u0645\u063a\u0644\u0642 ${signed(desk.grossWin)} \u0642\u0628\u0644 \u0627\u0644\u0631\u0633\u0648\u0645 \u00b7 \u0627\u0644\u0631\u0633\u0648\u0645 \u0645\u062e\u0635\u0648\u0645\u0629 \u0645\u0646 \u0627\u0644\u0631\u0628\u062d${desk.feesOpen > 0.009 ? ` \u00b7 ${desk.feesOpen.toFixed(2)}$ \u0639\u0644\u0649 \u0627\u0644\u0645\u0639\u0644\u0651\u0642` : ""}</p>
    </div>
    <div class="row" style="background:#0f1411aa;border-radius:10px;padding:8px 10px;margin-top:8px">

           </span>`
        : `<span class="mini">\u0644\u0627 \u0645\u0631\u0643\u0632 \u0635\u0627\u0641\u064d</span><span></span>`}
    </div>
  </div>`;
}

function bookHTML(s){
  const asks = (s.orderBook?.asks ?? []).slice(0, 10);
  const bids = (s.orderBook?.bids ?? []).slice(0, 10);
  const maxSize = Math.max(1, ...asks.map((r) => r.size), ...bids.map((r) => r.size));
  const rows = Math.max(asks.length, bids.length, 1);
  let body = "";
  for (let i = 0; i < rows; i++) {
    const a = asks[i], b = bids[i];
    const aw = a ? Math.min(100, (a.size / maxSize) * 100) : 0;
    const bw = b ? Math.min(100, (b.size / maxSize) * 100) : 0;
    body += `<tr>
      <td>${a ? `<span class="bb a" style="width:${aw}%"></span><span style="position:relative">${Math.round(a.size)}</span><span style="float:right" class="neg">${fmtPx(a.price)}</span>` : "\u2014"}</td>
      <td>${b ? `<span class="bb b" style="width:${bw}%"></span><span style="position:relative">${Math.round(b.size)}</span><span style="float:right" class="pos">${fmtPx(b.price)}</span>` : "\u2014"}</td>
    </tr>`;
  }
  return `
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <span style="font-family:ui-monospace;font-size:.72rem" class="mut">${s.lastPrice ? fmtPx(s.lastPrice) : "\u2014"}</span>
      <h2 class="sec">\u062f\u0641\u062a\u0631 \u0627\u0644\u0623\u0648\u0627\u0645\u0631 \u0627\u0644\u0645\u0628\u0627\u0634\u0631</h2>
    </div>
    <div class="grid2" style="text-align:center;font-size:.6rem;font-weight:700;margin-bottom:4px"><span class="neg">\u0639\u0631\u0648\u0636 \u0627\u0644\u0628\u064a\u0639</span><span class="pos">\u0637\u0644\u0628\u0627\u062a \u0627\u0644\u0634\u0631\u0627\u0621</span></div>
    ${asks.length === 0 && bids.length === 0 ? `<p class="mini" style="text-align:center;padding:18px 0">\u064a\u064f\u062d\u0645\u0651\u0644 \u0627\u0644\u062f\u0641\u062a\u0631 \u0645\u0646 \u0627\u0644\u0645\u0646\u0635\u0629\u2026</p>` : `<table class="book">${body}</table>`}
  </div>`;
}

function orderListHTML(title, levels, empty, openMark){
  let items = "";
  if (levels.length === 0) items = `<p class="mini" style="text-align:center;padding:14px 0">${esc(empty)}</p>`;
  else {
    items = levels.slice(0, 40).map((l) => `
      <div class="lvl">
        <span style="float:left" class="mut">${l.reduceOnly ? "\u062c\u0646\u064a" : openMark ? "\u0645\u0641\u062a\u0648\u062d" : "\u0645\u0633\u0644\u0651\u062d"}</span>
        <span class="${l.side === "sell" ? "neg" : "pos"}">${l.side === "sell" ? "\u0628\u064a\u0639" : "\u0634\u0631\u0627\u0621"} ${fmtPx(l.price)}</span>
      </div>`).join("");
  }
  return `<div style="background:#0f141199;border-radius:10px;padding:8px"><p class="mini" style="text-align:center;margin:0 0 4px">${esc(title)}</p>${items}</div>`;
}

  <div class="card gold">

      <span style="font-family:ui-monospace;font-size:.7rem" class="${s.biasScore >= 0 ? "goldt" : "neg"}">${signed(s.biasScore, 1)}</span>
    </p>
    <p class="mini" style="margin:4px 0 0">${esc([r?.vol === "wild" ? "\u062a\u0630\u0628\u0630\u0628 \u0642\u0648\u064a" : r?.vol === "calm" ? "\u062a\u0630\u0628\u0630\u0628 \u0628\u0633\u064a\u0637" : null, ...(s.biasReasons ?? [])].filter(Boolean).join(" \u00b7 "))}</p>
    <p class="mini" style="margin:6px 0 0">\u0627\u0644\u0623\u0648\u0627\u0645\u0631 \u062d\u0633\u0628 \u0627\u0644\u0648\u0636\u0639: \u0627\u0633\u062a\u0637\u0644\u0627\u0639 \u062b\u0645 \u062a\u0648\u0633\u0639\u0629 \u00b7 \u0641\u062c\u0648\u0629/\u0633\u064a\u0648\u0644\u0629 \u062a\u0645\u0646\u0639 \u0627\u0644\u0645\u0637\u0627\u0631\u062f\u0629 \u00b7 \u0644\u0627 \u062a\u062c\u0645\u064a\u062f \u0623\u0639\u0645\u0649</p>

function sparklineHTML(values){
  const v = values.slice(-60);
  if (v.length < 2) return `<div class="card mini" style="text-align:center;padding:24px 0">\u0644\u0627 \u0645\u0633\u0627\u0631 \u0623\u0633\u0639\u0627\u0631 \u0628\u0639\u062f\u2026</div>`;
  const min = Math.min(...v), max = Math.max(...v);
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * 100},${100 - ((x - min) / (max - min || 1)) * 100}`).join(" ");
  const up = v[v.length - 1] >= v[0];
  return `<div class="card"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:64px;display:block">
    <polyline fill="none" stroke="${up ? "#3ddc84" : "#ff5c5c"}" stroke-width="1.6" points="${pts}"/>
  </svg></div>`;
}

/* ---------- \u0627\u0644\u0623\u062d\u062f\u0627\u062b ---------- */
/* ---------- \u0625\u0628\u0642\u0627\u0621 \u0627\u0644\u062c\u0647\u0627\u0632 \u0645\u0633\u062a\u064a\u0642\u0638\u0627\u064b \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u062a\u0634\u063a\u064a\u0644 ---------- */
let wakeLock = null;
async function keepAwake(){
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener?.("release", () => { wakeLock = null; });
    }
  } catch {}
}
function releaseAwake(){
  try { wakeLock?.release?.(); wakeLock = null; } catch {}
}

async function withBusy(fn){
  if (App.busy) return;
  App.busy = "busy";
  try {
    App.state = await fn();
    if (App.state.status === "running") keepAwake(); else releaseAwake();
  } catch (err) {
    toast(err instanceof Error ? err.message : "\u062e\u0637\u0623 \u063a\u064a\u0631 \u0645\u062a\u0648\u0642\u0639");
    App.state = loadState();
  } finally {
    App.busy = null;
    renderView(true);
  }
}
function doStart(){ withBusy(() => actStartBot(null)); }
function doPause(){ withBusy(actPause); }
function doStop(){ withBusy(actStop); }
function doCycle(){ withBusy(actNewCycle); }
function doCloseLot(lotId){ withBusy(() => actCloseLot(lotId)); }

function saveRelayPref(){
  const relayEl = $("fRelay");
  if (!relayEl) return;
  App.prefs.relay = relayEl.value.trim();
  savePrefs(App.prefs);
  relayWorks = false;
  relaySkipUntil = 0;
  relayDead.clear();
}
function doSaveKeys(){
  const apiKey = $("fApiKey").value, apiSecret = $("fApiSecret").value, passphrase = $("fPassphrase").value;
  saveRelayPref();
  withBusy(() => actSaveKeys({ apiKey, apiSecret, passphrase }).then((s) => { toast("\u062a\u0645 \u0631\u0628\u0637 KuCoin \u2713 \u0631\u0635\u064a\u062f: $" + (s.exchangeBalance ?? "\u2014")); return s; }));
}
function doClearKeys(){ withBusy(actClearKeys); }
function doSaveConfig(){
  const s = App.state;
  const next = {
    ...s.config,
    leverage: Math.max(1, Math.min(100, Number($("fLeverage").value) || 1)),
    levels: Math.max(1, Math.min(64, Math.round(Number($("fLevels").value) || 1))),
    cycleBalance: Math.max(1, Number($("fBalance").value) || s.config.cycleBalance),
    huntPct: Math.max(0.05, Number($("fHunt").value) || s.config.huntPct),
    gridStepPct: Math.max(0.05, Number($("fStep").value) || s.config.gridStepPct),
    directionMode: $("fDir").value,
    direction: $("fDir").value === "auto" ? s.config.direction : $("fDir").value,
    mode: $("fMode").value,
  };
  withBusy(async () => {
    const st = await actPatchConfig(next);
    toast("\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0645\u0639\u0627\u0645\u0644\u0627\u062a \u2713");
    return st;
  });
}
function toggleSound(){
  App.prefs.sound = !App.prefs.sound;
  savePrefs(App.prefs);
  if (App.prefs.sound) beep(App.prefs.tone || "chime");
  renderView(true);
}
function setTone(tone){
  App.prefs.tone = tone;
  savePrefs(App.prefs);
  beep(tone);
}

/* ---------- \u0645\u0646\u062a\u0642\u064a \u0627\u0644\u0639\u0642\u0648\u062f ---------- */
function closeModal(){ $("modal").classList.remove("open"); }
function openContractPicker(){
  const sheet = $("sheet");
  sheet.innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <button type="button" class="btn sec sm" style="width:auto" onclick="closeModal()">\u0625\u063a\u0644\u0627\u0642</button>
      <h2 class="sec">\u0633\u0648\u0642 \u0627\u0644\u0639\u0642\u0648\u062f \u2014 KuCoin</h2>
    </div>
    <input class="field" id="fSearch" dir="ltr" placeholder="\u0627\u0628\u062d\u062b: BTC, PEPE, SOL\u2026" oninput="searchPicks(this.value)"/>
    <div id="pickList"><p class="mini" style="text-align:center;padding:18px 0">\u0627\u0643\u062a\u0628 \u0631\u0645\u0632 \u0627\u0644\u0639\u0645\u0644\u0629\u2026</p></div>
    <div class="sep"></div>
    <label class="flabel">\u0623\u0648 \u0627\u0643\u062a\u0628 \u0631\u0645\u0632 \u0627\u0644\u0639\u0642\u062f \u064a\u062f\u0648\u064a\u0627\u064b</label>
    <div class="row">
      <button type="button" class="btn sm" style="width:auto" onclick="useManualContract()">\u0627\u0633\u062a\u062e\u062f\u0627\u0645</button>
      <input class="field" id="fManual" dir="ltr" placeholder="\u0645\u062b\u0627\u0644: XBTUSDTM"/>
    </div>`;
  $("modal").classList.add("open");
  searchPicks("");
}
function useManualContract(){
  const raw = ($("fManual")?.value || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{1,18}USDTM$/.test(raw)) {
    toast("\u0627\u0643\u062a\u0628 \u0631\u0645\u0632 \u0639\u0642\u062f \u0635\u062d\u064a\u062d\u0627\u064b \u0645\u062b\u0644 XBTUSDTM");
    return;
  }
  pickContract(raw, raw.replace(/USDTM$/, ""));
}
let searchSeq = 0;
async function searchPicks(q){
  const seq = ++searchSeq;
  let hits = [];
  let offline = false;
  try {
    hits = await searchActiveContracts(q);
  } catch {
    offline = true;
  }
  // \u0639\u0646\u062f \u062d\u062c\u0628 \u0627\u0644\u0645\u062a\u0635\u0641\u062d (CORS) \u0623\u0648 \u0641\u0631\u0627\u063a \u0627\u0644\u0646\u062a\u064a\u062c\u0629 \u2014 \u0642\u0627\u0626\u0645\u0629 \u0627\u062d\u062a\u064a\u0627\u0637\u064a\u0629 \u0645\u0646 \u0623\u0634\u0647\u0631 \u0627\u0644\u0639\u0642\u0648\u062f
  if (!hits.length && (offline || (networkBlocked && !hasNativeHttp()) || demoTimer)) {
    const qq = (q || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    const aliases = qq === "BTC" ? ["BTC", "XBT"] : qq ? [qq] : [];
    hits = FALLBACK_CONTRACTS.filter((r) => !qq || aliases.some((a) => r.display.includes(a) || r.symbol.includes(a)));
  }
  const el = $("pickList");
  if (!el || seq !== searchSeq) return;
  el.innerHTML = hits.length === 0
    ? `<p class="mini" style="text-align:center;padding:14px 0">\u0644\u0627 \u0646\u062a\u0627\u0626\u062c \u2014 \u0623\u0648 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0645\u062d\u062c\u0648\u0628 \u0645\u0646 \u0627\u0644\u0645\u062a\u0635\u0641\u062d</p>`
    : `${offline && hits.length && !demoTimer && !hasNativeHttp() ? `<p class="mini" style="text-align:center;padding:6px 0">\u0642\u0627\u0626\u0645\u0629 \u0627\u062d\u062a\u064a\u0627\u0637\u064a\u0629 \u2014 \u062f\u0627\u062e\u0644 APK \u062a\u064f\u062c\u0644\u0628 \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062d\u064a\u0629 \u0645\u0646 KuCoin \u0645\u0628\u0627\u0634\u0631\u0629</p>` : ""}` + hits.map((h) => `
        <div class="hit" onclick="pickContract('${esc(h.symbol)}','${esc(h.display)}')">
          <div style="text-align:right">
            <b style="font-family:ui-monospace">${esc(h.display)}</b>
            <div class="mini" style="font-family:ui-monospace">${esc(h.symbol)}</div>
          </div>
          <div style="text-align:left">
            <span style="font-family:ui-monospace;font-size:.72rem">${fmtPx(h.price)}</span>
            <div class="mini">${h.funding >= 0 ? "+" : ""}${(h.funding * 100).toFixed(4)}% \u062a\u0645\u0648\u064a\u0644</div>
          </div>
        </div>`).join("");
}
async function pickContract(symbol, display){
  closeModal();
  await withBusy(async () => {
    const st = await actPatchConfig({ symbol, displaySymbol: display });
    await switchConnection(symbol);
    chartBars = [];
    await refreshKlines(symbol);
    if (!chartBars.length) {
      // \u0644\u0627 \u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0645\u0646\u0635\u0629 (\u0645\u0639\u0627\u064a\u0646\u0629/\u0645\u062a\u062c\u0631\u062d\u0648\u0628) \u2014 \u0627\u0632\u0631\u0639 \u0634\u0645\u0648\u0639\u0627\u064b \u062a\u0648\u0636\u064a\u062d\u064a\u0629 \u0641\u0648\u0631\u0627\u064b \u0644\u0644\u0641\u0631\u064a\u0645 \u0627\u0644\u0645\u062e\u062a\u0627\u0631
      WS.symbol = symbol;
      WS.price = demoPriceFor(symbol);
      seedDemoBars();
    }
    toast(`\u0627\u0646\u062a\u0642\u0627\u0644 \u0625\u0644\u0649 ${display} \u2713`);
    return st;
  });
}

/* ---------- \u0627\u0644\u0631\u0633\u0645 \u0627\u0644\u0631\u0626\u064a\u0633\u064a ---------- */
let renderQueued = false;
function renderView(force){
  const v = $("view");
  if (App.view === "settings" && !force) return;
  if (App.busy && !force) { if (!renderQueued) { renderQueued = true; } return; }
  v.innerHTML = App.view === "home" ? homeHTML(App.state) : App.view === "stats" ? statsHTML(App.state) : settingsHTML(App.state);
  if (App.view === "home") drawChart();
}
function renderIfVisible(){
  if (document.hidden) return;
  renderView(false);
  if (App.view === "home") drawChart();
  updateHeader();
}
function updateHeader(){
  const s = App.state;
  const pill = $("connPill");
  const liveMode = s.config.mode === "live";
  const liveFeed = WS.connected || Date.now() - (App.lastSnapAt || 0) < 5000;
  const label = demoTimer ? "\u0645\u062d\u0627\u0643\u0627\u0629" : liveFeed ? (liveMode && s.hasKeys ? "\u062d\u064a \u0645\u0628\u0627\u0634\u0631" : "\u0645\u0628\u0627\u0634\u0631") : "\u0645\u0646\u0641\u0635\u0644";
  pill.classList.toggle("on", Boolean(demoTimer || liveFeed));
  $("connTxt").textContent = label;
  $("hdrSub").textContent = `${s.config.displaySymbol} \u00b7 ${s.status === "running" ? "\u064a\u0639\u0645\u0644" : s.status === "paused" ? "\u0645\u0624\u0642\u062a" : s.status === "stopped" ? "\u0645\u062a\u0648\u0642\u0641" : "\u062e\u0627\u0645\u0644"} \u00b7 \u0646\u0628\u0636 ${s.heartbeat}`;
}

/* ---------- \u0627\u0644\u062a\u0634\u063a\u064a\u0644 ---------- */
async function boot(){
  App.state = loadState();
  renderView(true);
  updateHeader();
  setTimeout(() => { $("splash").classList.add("gone"); }, 1100);

  // \u0627\u062a\u0635\u0627\u0644 \u062d\u064a + \u0645\u062d\u0627\u0643\u0627\u0629 \u0627\u062d\u062a\u064a\u0627\u0637\u064a\u0629
  if (window.self === window.top) {
    await switchConnection(App.state.config.symbol);
    await refreshKlines(App.state.config.symbol);
    setInterval(() => {
      if (!document.hidden) refreshKlines(App.state.config.symbol);
    }, 25_000);
    ensureBotRuntime();
    setInterval(updateHeader, 2000);
    window.addEventListener("online", () => switchConnection(App.state.config.symbol));
  }
  window.addEventListener("resize", () => { if (App.view === "home") drawChart(); });

  $("navHome").onclick = () => { App.view = "home"; setNav(); renderView(true); };
  $("navStats").onclick = () => { App.view = "stats"; setNav(); renderView(true); };
  $("navSettings").onclick = () => { App.view = "settings"; setNav(); renderView(true); };
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { renderIfVisible(); if (App.state.status === "running") keepAwake(); }
  });
  if (App.state.status === "running") keepAwake();
}
function setNav(){
  $("navHome").classList.toggle("active", App.view === "home");
  $("navStats").classList.toggle("active", App.view === "stats");
  $("navSettings").classList.toggle("active", App.view === "settings");
}
boot();

</script>
