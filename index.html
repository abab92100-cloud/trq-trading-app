<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TRQ Trading — بوت تداول KuCoin الآجلة</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // شاشة تشخيص: أي خطأ يمنع الإقلاع يظهر نصًا بدل الشاشة السوداء
      (function () {
        function show(msg) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:auto 8px 8px 8px;z-index:9999;background:#2a0d14;color:#f43f5e;' +
            'border:1px solid #f43f5e;border-radius:10px;padding:10px;font:11px monospace;direction:ltr;' +
            'white-space:pre-wrap;max-height:40vh;overflow:auto';
          d.textContent = 'TRQ startup error:\n' + msg;
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('promise: ' + (e.reason && (e.reason.message || e.reason)));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
