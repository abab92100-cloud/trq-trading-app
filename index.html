<script>
"use strict";
/* ============================================================
   TRQ_ Trading \u2014 \u0646\u0633\u062e\u0629 \u0643\u0627\u0645\u0644\u0629 \u0645\u0646 \u0645\u062d\u0631\u0643 AB_TRADING
   \u0627\u0644\u0645\u062d\u0631\u0643 \u0645\u0646\u0642\u0648\u0644 100% \u0645\u0646 \u0627\u0644\u0645\u0635\u062f\u0631 (engine.ts / kucoin.ts /
   runtime.server.ts / ab-trading-actions.ts / store.ts)
   ============================================================ */

/* ---------- \u0627\u0644\u062b\u0648\u0627\u0628\u062a ---------- */
const TRADING_TENANT = "abtr:";
const DESK_USER_ID = "ab-desk";
const FUTURES = "https://api-futures.kucoin.com";
const TICK_COMMANDS = new Set(["idle-quote", "paper-tick", "live-tick", "pause-quote", "tick-retry"]);
const MAX_FILLED_ADDS = 8;
const MIN_HUNT_GAP_PCT = 0.12;
const SCOUT_MS = 45_000;
const ADD_COOLDOWN_MS = 20_000;
const HUNT_COOLDOWN_MS = 30_000;
const MAX_HUNT_OPEN = 3;
const MIN_NET_USD = 0.05;
const MAX_TRAIL = 90;
const MAX_LOGS = 60;
const MAX_JOURNAL = 80;
const KLINE_GRAN = new Set([1, 5, 15, 30, 60, 120, 240, 480, 720, 1440]);

const DEFAULT_CONFIG = {
  symbol: "XBTUSDTM",
  displaySymbol: "BTC",
  leverage: 3,
  gridStepPct: 0.18,
  huntPct: 0.1,
  levels: 16,
  direction: "short",
  directionMode: "auto",
  cycleBalance: 104.15,
  mode: "paper",
  edition: "trading",
};

/* ---------- \u0627\u0644\u0645\u062d\u0631\u0643: \u0623\u062f\u0648\u0627\u062a \u0645\u0633\u0627\u0639\u062f\u0629 ---------- */
function isTradingEdition(state){ return state.config.edition === "trading"; }

function loggedRecently(state, needle, ms){
  const hit = state.logs.find((l) => l.text.includes(needle));
  return Boolean(hit && Date.now() - hit.at < ms);
}

function filledAdds(state){
  const opens = (state.journal ?? []).filter((j) => j.status === "open");
  const fromJournal = opens.reduce((n, j) => n + Math.max(1, j.mergedOrders || 1), 0);
  if (fromJournal > 0) return fromJournal;
  if (!state.position) return 0;
  return 1;
}

function openHuntLots(state){
  return (state.journal ?? []).filter((j) => j.status === "open" && j.source === "\u0635\u0641\u0642\u0629").length;
}

function addsBlocked(state, _price = state.lastPrice || state.markPrice || 0){
  if (!isTradingEdition(state) || state.status !== "running") return false;
  const cap = Math.max(1, state.config.levels || MAX_FILLED_ADDS);
  if (filledAdds(state) >= cap) return true;
  const r = state.regime ?? readRegime(state);
  return Boolean(state.position && r.shock);
}

function inAddZone(state, price = state.lastPrice || state.markPrice || 0){
  if (!isTradingEdition(state) || state.status !== "running" || !price) return false;
  if (addsBlocked(state, price)) return false;
  if (lastJumpPct(state) > 0.4) return false;
  if (!bookQuality(state).ok) return false;
  const pos = state.position;
  if (!pos || !pos.entry) return true;
  const stepPct = Math.max(0.12, state.config.gridStepPct);
  const improve =
    pos.side === "short"
      ? ((price - pos.entry) / pos.entry) * 100
      : ((pos.entry - price) / pos.entry) * 100;
  if (improve < stepPct * 0.7) return false;
  const mom = state.confluence?.momentum ?? 0;
  const regime = state.regime ?? readRegime(state);
  const againstTrend =
    (pos.side === "long" && regime.trend === "down") || (pos.side === "short" && regime.trend === "up");
  if (againstTrend && ((pos.side === "long" && mom < -0.06) || (pos.side === "short" && mom > 0.06))) return false;
  if (pos.side === "long" && mom < -0.12) return false;
  if (pos.side === "short" && mom > 0.12) return false;
  return true;
}

function adversePct(state, price){
  const pos = state.position;
  if (!pos || !price || !pos.entry) return 0;
  return pos.side === "short"
    ? ((price - pos.entry) / pos.entry) * 100
    : ((pos.entry - price) / pos.entry) * 100;
}

function lastJumpPct(state){
  const t = state.priceTrail ?? [];
  if (t.length < 2) return 0;
  const a = t[t.length - 2];
  const b = t[t.length - 1];
  return a > 0 ? (Math.abs(b - a) / a) * 100 : 0;
}

function bookQuality(state){
  const book = state.orderBook;
  const price = state.lastPrice || 0;
  if (!book?.bids?.length || !book?.asks?.length || !price) return { ok: true, reason: "" };
  const bestBid = book.bids[0]?.price ?? 0;
  const bestAsk = book.asks[0]?.price ?? 0;
  if (bestBid <= 0 || bestAsk <= 0) return { ok: true, reason: "" };
  const mid = (bestBid + bestAsk) / 2;
  const spreadPct = mid > 0 ? ((bestAsk - bestBid) / mid) * 100 : 0;
  if (spreadPct > 0.35) return { ok: false, reason: "\u0633\u0628\u0631\u064a\u062f \u0648\u0627\u0633\u0639 \u2014 \u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0633\u064a\u0648\u0644\u0629" };
  if (state.markPrice && state.markPrice > 0) {
    const slip = (Math.abs(price - state.markPrice) / state.markPrice) * 100;
    if (slip > 0.28) return { ok: false, reason: "\u0627\u0646\u0632\u0644\u0627\u0642 \u0639\u0646 \u0627\u0644\u0645\u0627\u0631\u0643" };
  }
  const jump = lastJumpPct(state);
  if (jump > 0.45) return { ok: false, reason: "\u0641\u062c\u0648\u0629 \u0633\u0639\u0631 \u2014 \u0644\u0627 \u0645\u0644\u0627\u062d\u0642\u0629" };
  const short = state.config.direction === "short";
  const wall = short ? book.bids : book.asks;
  let depthQty = 0;
  for (const lvl of wall.slice(0, 8)) depthQty += lvl.size;
  const orderQty = contractsForLevel(state, price);
  if (depthQty > 0 && orderQty > 0 && depthQty < orderQty * 2.5) {
    return { ok: false, reason: "\u0633\u064a\u0648\u0644\u0629 \u0636\u0639\u064a\u0641\u0629 \u0641\u064a \u0627\u0644\u062f\u0641\u062a\u0631" };
  }
  return { ok: true, reason: "" };
}

function retStdev(trail){
  if (trail.length < 4) return 0;
  const rets = [];
  for (let i = 1; i < trail.length; i += 1) {
    if (trail[i - 1] > 0) rets.push(((trail[i] - trail[i - 1]) / trail[i - 1]) * 100);
  }
  if (rets.length < 3) return 0;
  const m = rets.reduce((a, b) => a + b, 0) / rets.length;
  return Math.sqrt(rets.reduce((s, x) => s + (x - m) ** 2, 0) / rets.length);
}

function readRegime(state){
  const trail = state.priceTrail ?? [];
  const conf = state.confluence ?? emptyConfluence();
  const vol = retStdev(trail);
  const mom = conf.momentum;
  const jump = lastJumpPct(state);
  const shock = jump > 0.9 || Math.abs(mom) > 0.9;
  const emaUp = state.emaFast != null && state.emaSlow != null && state.emaFast > state.emaSlow;
  const emaDn = state.emaFast != null && state.emaSlow != null && state.emaFast < state.emaSlow;
  let trend = "range";
  if ((emaUp && mom > 0.04 && state.biasScore > 3) || mom > 0.12) trend = "up";
  else if ((emaDn && mom < -0.04 && state.biasScore < -3) || mom < -0.12) trend = "down";
  if (Math.abs(mom) < 0.04 && vol < 0.08) trend = "range";
  let volKind = "normal";
  if (vol >= 0.22 || shock) volKind = "wild";
  else if (vol <= 0.045 && Math.abs(mom) < 0.045) volKind = "calm";
  const young = Boolean(state.startedAt && Date.now() - state.startedAt < SCOUT_MS);
  const scoutOnly = shock || volKind === "wild" || young;
  let label = "\u0633\u0648\u0642 \u0639\u0631\u0636\u064a";
  if (shock) label = "\u062a\u063a\u064a\u0631 \u0645\u0641\u0627\u062c\u0626";
  else if (volKind === "wild" && trend === "up") label = "\u0635\u0627\u0639\u062f \u0645\u062a\u0630\u0628\u0630\u0628 \u0642\u0648\u064a";
  else if (volKind === "wild" && trend === "down") label = "\u0647\u0627\u0628\u0637 \u0645\u062a\u0630\u0628\u0630\u0628 \u0642\u0648\u064a";
  else if (trend === "up") label = volKind === "calm" ? "\u0635\u0627\u0639\u062f \u0647\u0627\u062f\u0626" : "\u0627\u062a\u062c\u0627\u0647 \u0635\u0627\u0639\u062f";
  else if (trend === "down") label = volKind === "calm" ? "\u0647\u0627\u0628\u0637 \u0647\u0627\u062f\u0626" : "\u0627\u062a\u062c\u0627\u0647 \u0647\u0627\u0628\u0637";
  else if (volKind === "wild") label = "\u0639\u0631\u0636\u064a \u0645\u062a\u0630\u0628\u0630\u0628";
  else if (volKind === "calm") label = "\u0639\u0631\u0636\u064a \u0647\u0627\u062f\u0626";
  const sizeMult = shock ? 0.65 : volKind === "wild" ? 0.75 : trend === "range" ? 0.9 : 1;
  const stepMult = volKind === "wild" || shock ? 1.35 : volKind === "calm" ? 0.9 : 1;
  const huntMult = shock ? 1.5 : volKind === "wild" ? 1.25 : 1;
  const maxAdds = shock || volKind === "wild" ? 1 : 3;
  return { trend, vol: volKind, shock, label, sizeMult, stepMult, huntMult, maxAdds, scoutOnly };
}

function evaluateShield(_state, _price){
  return { freeze: false, flatten: false, reason: "" };
}

function cancelPendingAdds(state){
  for (const g of state.grid) {
    if (!g.reduceOnly && (g.status === "armed" || g.status === "open") && !g.filledAt) {
      g.status = "cancelled";
      g.exchangeOrderId = null;
    }
  }
}

function addStepPct(state){
  const regime = isTradingEdition(state) ? (state.regime ?? readRegime(state)) : null;
  return Math.max(0.12, state.config.gridStepPct) * (regime?.stepMult ?? 1);
}

function tooClose(a, b, stepPct){
  if (!(a > 0) || !(b > 0)) return false;
  return (Math.abs(a - b) / Math.max(a, b)) * 100 < stepPct * 0.55;
}

function sanitizeAdds(state){
  const cap = Math.max(1, state.config.levels || MAX_FILLED_ADDS);
  if (filledAdds(state) >= cap) {
    const side = state.position?.side;
    for (const g of state.grid) {
      if (g.reduceOnly || g.filledAt) continue;
      if (g.status !== "armed" && g.status !== "open") continue;
      if (g.lane === "trend") continue;
      const addSide = g.side === "sell" ? "short" : "long";
      if (!side || addSide === side) {
        g.status = "cancelled";
        g.exchangeOrderId = null;
      }
    }
    return;
  }
  const stepPct = addStepPct(state);
  const px = state.lastPrice || state.markPrice || 0;
  for (const side of ["buy", "sell"]) {
    const live = state.grid
      .filter((g) => !g.reduceOnly && g.side === side && (g.status === "armed" || g.status === "open"))
      .sort((a, b) => {
        if (a.status !== b.status) return a.status === "open" ? -1 : 1;
        return Math.abs((b.price || 0) - px) - Math.abs((a.price || 0) - px);
      });
    const kept = [];
    for (const g of live) {
      const gap = g.lane ? Math.max(stepPct, state.config.gridStepPct * 4) : stepPct;
      if (kept.length >= cap || kept.some((k) => tooClose(k.price, g.price, gap))) {
        g.status = "cancelled";
        g.exchangeOrderId = null;
        continue;
      }
      kept.push(g);
    }
  }
}

function rearmReduceOnly(state){
  for (const g of state.grid) {
    if (g.reduceOnly && (g.status === "open" || g.status === "armed")) {
      g.status = "armed";
      g.exchangeOrderId = null;
    }
  }
}

function weightedAverage(fills){
  let notional = 0;
  let qty = 0;
  for (const f of fills) {
    if (f.qty <= 0 || f.price <= 0) continue;
    notional += f.price * f.qty;
    qty += f.qty;
  }
  return qty > 0 ? notional / qty : 0;
}

function lotNetPnl(side, entry, exit, qty, multiplier, fees){
  const sign = side === "short" ? 1 : -1;
  return sign * (entry - exit) * multiplier * qty - fees;
}

function uid(prefix){
  return `${prefix}_${Math.random().toString(36).slice(2, 10)}${Date.now().toString(36).slice(-4)}`;
}

function pairTag(state){
  return state.config.displaySymbol || state.config.symbol.replace(/USDTM$/i, "") || "?";
}

function roundToTick(price, tick){
  if (!tick || tick <= 0) return price;
  const n = Math.round(price / tick) * tick;
  const decimals = Math.max(0, Math.ceil(-Math.log10(tick)));
  return Number(n.toFixed(decimals));
}

function pushLog(state, kind, text){
  state.logs = [{ id: uid("log"), at: Date.now(), kind, text }, ...state.logs].slice(0, MAX_LOGS);
}

function emptyBook(){ return { bids: [], asks: [] }; }

function emptyConfluence(){

}

function hydrateState(raw){
  const base = createIdleState(raw?.config);
  if (!raw || raw.schemaVersion !== 1) return base;
  const next = {
    ...base,
    ...raw,
    config: { ...DEFAULT_CONFIG, ...raw.config },
    orderBook: raw.orderBook ?? emptyBook(),
    tape: raw.tape ?? [],
    emaFast: raw.emaFast ?? null,
    emaSlow: raw.emaSlow ?? null,
    biasScore: raw.biasScore ?? 0,
    biasReasons: raw.biasReasons ?? [],
    priceTrail: raw.priceTrail ?? [],
    lastBiasFlipAt: raw.lastBiasFlipAt ?? null,
    openLot: raw.openLot ?? null,
    journal: (raw.journal ?? []).map((j) => ({ ...j, status: j.status ?? "closed" })),
    cycles: raw.cycles ?? [],
    cycleSeq: raw.cycleSeq ?? 0,
    activeCycle: raw.activeCycle ?? null,
    confluence: raw.confluence ?? emptyConfluence(),
    huntOpen: raw.huntOpen ?? 0,
    gridAnchor: raw.gridAnchor ?? raw.huntAnchor ?? null,
    grid: (raw.grid ?? []).map((g) => ({ ...g, origin: g.origin ?? "grid" })),
    liquidationPrice: raw.liquidationPrice ?? null,
    maintMarginRate: raw.maintMarginRate ?? 0.004,
    exchangeLiqPrice: raw.exchangeLiqPrice ?? null,
    shieldFrozen: raw.shieldFrozen ?? false,
    shieldReason: raw.shieldReason ?? "",
    lastAddAt: raw.lastAddAt ?? null,
    addsHeldAt: raw.addsHeldAt ?? 0,
    regime: raw.regime ?? null,
    rev: raw.rev ?? 0,
    ignoreExchangePosUntil: raw.ignoreExchangePosUntil ?? 0,
  };
  compactOpenJournal(next);
  const noise = /\u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0645\u0646\u0635\u0629|\u064a\u0639\u0627\u062f \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629/;
  next.logs = (next.logs ?? []).filter((l) => !noise.test(l.text ?? ""));
  if (next.lastError && noise.test(next.lastError)) next.lastError = null;
  return next;
}

function cloneState(state){
  return JSON.parse(JSON.stringify(state));
}

function resetForNewCycle(prev){
  const rolled = Math.max(
    0.01,
    Math.round((prev.config.cycleBalance + prev.realizedPnl - prev.feesPaid) * 100) / 100,
  );
  const fresh = createIdleState({ ...prev.config, cycleBalance: rolled });
  fresh.hasKeys = prev.hasKeys;
  fresh.keyHint = prev.keyHint;
  fresh.makerFee = prev.makerFee;
  fresh.takerFee = prev.takerFee;
  fresh.funding = prev.funding;
  fresh.multiplier = prev.multiplier;
  fresh.tickSize = prev.tickSize;
  fresh.lastPrice = prev.lastPrice;
  fresh.markPrice = prev.markPrice;
  fresh.connected = prev.connected;
  fresh.journal = [];
  fresh.cycles = [];
  fresh.cycleSeq = 0;
  fresh.activeCycle = null;
  fresh.realizedPnl = 0;
  fresh.gridPnl = 0;
  fresh.feesPaid = 0;
  fresh.huntCount = 0;
  fresh.logs = [
    {
      id: `c_${Date.now()}`,
      at: Date.now(),
      kind: "info",
      text: `\u062f\u0648\u0631\u0629 \u062c\u062f\u064a\u062f\u0629 \u2014 \u0631\u0635\u064a\u062f ${rolled.toFixed(2)} \u2014 \u0645\u064f\u0633\u062d \u0627\u0644\u0633\u062c\u0644 \u0648\u0627\u0644\u0635\u0641\u0642\u0627\u062a`,
    },
  ];
  return fresh;
}

function assertDurable(prev, next, command){
  if (!prev) return;
  const hadLife =
    prev.status === "running" ||
    prev.status === "paused" ||
    prev.grid.length > 0 ||
    prev.position !== null ||
    prev.heartbeat > 0;
  const wiped =
    next.status === "idle" &&
    next.grid.length === 0 &&
    next.position === null &&
    next.heartbeat === 0;
  if (hadLife && wiped && command !== "reset-hard") {
    throw new Error(`Refusing to wipe bot state on ${command}`);
  }
}

function nextEma(prev, price, period){
  const k = 2 / (period + 1);
  return prev === null ? price : price * k + prev * (1 - k);
}

function volSum(levels){
  if (!levels) return 0;
  let n = 0;
  for (const l of levels) n += l.size;
  return n;
}

function scoreBias(input){
  let score = 0;
  const reasons = [];

  const bookTot = input.bidVol + input.askVol;
  if (bookTot > 0) {
    const imb = (input.bidVol - input.askVol) / bookTot;
    score += imb * 40;
    if (Math.abs(imb) > 0.08) {
      reasons.push(imb > 0 ? `\u062f\u0641\u062a\u0631 \u0627\u0644\u0645\u0634\u062a\u0631\u064a\u0646 ${(imb * 100).toFixed(0)}\u066a` : `\u062f\u0641\u062a\u0631 \u0627\u0644\u0628\u0627\u0626\u0639\u064a\u0646 ${(Math.abs(imb) * 100).toFixed(0)}\u066a`);
    }
  }

  const tapeTot = input.buyTape + input.sellTape;
  if (tapeTot > 0) {
    const timb = (input.buyTape - input.sellTape) / tapeTot;
    score += timb * 25;
    if (Math.abs(timb) > 0.1) {
      reasons.push(timb > 0 ? "\u0634\u0631\u064a\u0637 \u0634\u0631\u0627\u0621 \u063a\u0627\u0644\u0628" : "\u0634\u0631\u064a\u0637 \u0628\u064a\u0639 \u063a\u0627\u0644\u0628");
    }
  }

  if (input.cvd !== 0) {
    const mag = Math.min(20, Math.log10(Math.abs(input.cvd) + 1) * 5);
    score += Math.sign(input.cvd) * mag;
    reasons.push(input.cvd > 0 ? "CVD \u0634\u0631\u0627\u0621" : "CVD \u0628\u064a\u0639");
  }

  if (input.funding !== 0) {
    const fPts = Math.max(-20, Math.min(20, -input.funding * 80000));
    score += fPts;
    reasons.push(input.funding > 0 ? "\u062a\u0645\u0648\u064a\u0644 \u0625\u064a\u062c\u0627\u0628\u064a \u2192 \u0634\u0648\u0631\u062a" : "\u062a\u0645\u0648\u064a\u0644 \u0633\u0644\u0628\u064a \u2192 \u0644\u0648\u0646\u063a");
  }

  if (input.emaFast != null && input.emaSlow != null && input.price > 0) {
    if (input.price > input.emaFast && input.emaFast > input.emaSlow) {
      score += 15;
      reasons.push("\u0645\u062a\u0648\u0633\u0637 \u0633\u0631\u064a\u0639 \u0641\u0648\u0642 \u0627\u0644\u0628\u0637\u064a\u0621");
    } else if (input.price < input.emaFast && input.emaFast < input.emaSlow) {
      score -= 15;
      reasons.push("\u0645\u062a\u0648\u0633\u0637 \u0633\u0631\u064a\u0639 \u062a\u062d\u062a \u0627\u0644\u0628\u0637\u064a\u0621");
    }
  }

  const direction = score >= 0 ? "long" : "short";
  return { direction, score: Math.round(score * 10) / 10, reasons: reasons.slice(0, 4) };
}

function readConfluence(state){
  const trail = state.priceTrail ?? [];
  const tape = state.tape ?? [];
  const bids = volSum(state.orderBook?.bids);
  const asks = volSum(state.orderBook?.asks);
  const bookDen = bids + asks;
  const bookImb = bookDen > 0 ? (bids - asks) / bookDen : 0;
  let tapeNotional = 0;
  let tapePx = 0;
  for (const t of tape) {
    tapeNotional += t.size;
    tapePx += t.price * t.size;
  }
  const vwap = tapeNotional > 0 ? tapePx / tapeNotional : null;
  const window = trail.slice(-10);
  let momentum = 0;
  if (window.length >= 2 && window[0] > 0) {
    momentum = ((window[window.length - 1] - window[0]) / window[0]) * 100;
  }
  let slope = 0;
  if (window.length >= 4) {
    const n = window.length;
    let sx = 0;
    let sy = 0;
    let sxy = 0;
    let sx2 = 0;
    for (let i = 0; i < n; i += 1) {
      sx += i;
      sy += window[i];
      sxy += i * window[i];
      sx2 += i * i;
    }
    const den = n * sx2 - sx * sx;
    slope = den ? (n * sxy - sx * sy) / den : 0;
  }
  const reasons = [];
  let score = 0;
  if (Math.abs(bookImb) > 0.08) {
    score += bookImb * 40;
    reasons.push(bookImb > 0 ? "\u062f\u0641\u062a\u0631 \u0634\u0631\u0627\u0621 \u063a\u0627\u0644\u0628" : "\u062f\u0641\u062a\u0631 \u0628\u064a\u0639 \u063a\u0627\u0644\u0628");
  }
  if (Math.abs(momentum) >= 0.04) {
    score += momentum * 8;
    reasons.push(momentum > 0 ? "\u0632\u062e\u0645 \u0635\u0627\u0639\u062f" : "\u0632\u062e\u0645 \u0647\u0627\u0628\u0637");
  }
  if (vwap && state.lastPrice) {
    if (state.lastPrice > vwap) {
      score += 8;
      reasons.push("\u0641\u0648\u0642 VWAP");
    } else if (state.lastPrice < vwap) {
      score -= 8;
      reasons.push("\u062a\u062d\u062a VWAP");
    }
  }
  if (state.emaFast != null && state.emaSlow != null) {
    if (state.emaFast > state.emaSlow) {
      score += 10;
      reasons.push("\u0645\u064a\u0644 \u0635\u0627\u0639\u062f");
    } else if (state.emaFast < state.emaSlow) {
      score -= 10;
      reasons.push("\u0645\u064a\u0644 \u0647\u0627\u0628\u0637");
    }
  }
  const idle =
    window.length >= 8 &&
    tape.length >= 8 &&
    Math.abs(momentum) < 0.04 &&
    Math.abs(bookImb) < 0.08;
  if (idle) reasons.unshift("\u0627\u0644\u0633\u0648\u0642 \u062e\u0627\u0645\u0644 \u2014 \u0644\u0627 \u0627\u0635\u0637\u064a\u062f");
  return {
    score: Math.round(score * 10) / 10,
    idle,
    vwap,
    momentum: Math.round(momentum * 1000) / 1000,
    bookImb: Math.round(bookImb * 1000) / 1000,
    slope,
    reasons: reasons.slice(0, 4),
  };
}

function tapeSides(tape){
  let buy = 0;
  let sell = 0;
  if (!tape) return { buy, sell };
  for (const t of tape) {
    if (t.side === "buy") buy += t.size;
    else sell += t.size;
  }
  return { buy, sell };
}

function applyMarketMeta(state, market){
  state.lastPrice = market.price;
  state.markPrice = market.markPrice;
  state.makerFee = market.makerFee;
  state.takerFee = market.takerFee;
  state.funding = market.funding;
  state.multiplier = market.multiplier;
  state.tickSize = market.tickSize;
  state.cvd += market.cvdDelta;
  state.lastServerTickAt = Date.now();
  if (market.orderBook) state.orderBook = market.orderBook;
  if (market.tape) state.tape = market.tape;
  if (market.price > 0) {
    state.priceTrail = [...state.priceTrail, market.price].slice(-MAX_TRAIL);
    state.emaFast = nextEma(state.emaFast, market.price, 9);
    state.emaSlow = nextEma(state.emaSlow, market.price, 21);
  }
  state.confluence = readConfluence(state);
  state.regime = readRegime(state);
  if (market.maintMargin && market.maintMargin > 0) state.maintMarginRate = market.maintMargin;
}

function resolveDirection(state, now = Date.now()){
  const mode = state.config.directionMode ?? "auto";
  if (mode === "long" || mode === "short") {
    state.config.direction = mode;
  }

  const sides = tapeSides(state.tape);
  const bias = scoreBias({
    cvd: state.cvd,
    funding: state.funding,
    bidVol: volSum(state.orderBook?.bids),
    askVol: volSum(state.orderBook?.asks),
    buyTape: sides.buy,
    sellTape: sides.sell,
    price: state.lastPrice || 0,
    emaFast: state.emaFast,
    emaSlow: state.emaSlow,
  });
  state.biasScore = bias.score;
  state.biasReasons = bias.reasons;

  if (mode === "long" || mode === "short") return mode;
  if (state.status === "paused" || state.status === "stopped") return state.config.direction;

  const regime = state.regime ?? readRegime(state);
  state.regime = regime;
  const mom = state.confluence?.momentum ?? 0;

  if (state.position) {
    const pos = state.position;
    const mode = state.config.directionMode ?? "auto";
    const flipped =
      isTradingEdition(state) &&
      mode === "auto" &&
      state.lastBiasFlipAt != null &&
      now - state.lastBiasFlipAt < 120_000 &&
      state.config.direction !== pos.side;
    if (!flipped) state.config.direction = pos.side;
    if (addsBlocked(state) && !loggedRecently(state, "\u062d\u062f \u0627\u0644\u0634\u0628\u0643\u0629", 120_000)) {
      pushLog(state, "server", `\u0627\u0643\u062a\u0645\u0644\u062a \u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0627\u0644\u0634\u0628\u0643\u0629 (${filledAdds(state)}) \u2014 \u0627\u0644\u062c\u0646\u064a \u0645\u0633\u062a\u0645\u0631`);
    }
    return state.config.direction;
  }

  const prev = state.config.direction;
  const nextDir = bias.direction;
  if (regime.shock) return prev;
  if (isTradingEdition(state)) {
    if (regime.trend === "up" && bias.score > -6 && mom > -0.04) {
      if (prev !== "long") state.lastBiasFlipAt = now;
      state.config.direction = "long";
      return "long";
    }
    if (regime.trend === "down" && bias.score < 6 && mom < 0.04) {
      if (prev !== "short") state.lastBiasFlipAt = now;
      state.config.direction = "short";
      return "short";
    }
    if (nextDir === "long" && mom < -0.04) return prev;
    if (nextDir === "short" && mom > 0.04) return prev;
  }

  if (Math.abs(bias.score) < 4) return prev;
  const need = isTradingEdition(state) ? 14 : 10;
  const canFlip = state.lastBiasFlipAt === null || now - state.lastBiasFlipAt > 4_000;
  if (nextDir !== prev && canFlip && Math.abs(bias.score) >= need) {
    state.config.direction = nextDir;
    state.lastBiasFlipAt = now;
  } else if (nextDir === prev) {
    state.config.direction = nextDir;
  }
  return state.config.direction;
}

function huntAligned(state){
  const conf = state.confluence ?? emptyConfluence();
  const short = state.config.direction === "short";
  const q = bookQuality(state);
  if (!q.ok) return false;
  const regime = state.regime ?? readRegime(state);
  const withTrend =
    isTradingEdition(state) &&
    !state.position &&
    ((short && regime.trend === "down" && conf.momentum <= -0.06) ||
      (!short && regime.trend === "up" && conf.momentum >= 0.06));
  if (regime.shock && !withTrend) return false;
  if (isTradingEdition(state) && short && regime.trend === "up") return false;
  if (isTradingEdition(state) && !short && regime.trend === "down") return false;
  if (conf.idle && (state.tape?.length ?? 0) >= 8) return false;
  if (short && conf.momentum > 0.06) return false;
  if (!short && conf.momentum < -0.06) return false;
  if (short && state.biasScore >= 10) return false;
  if (!short && state.biasScore <= -10) return false;
  if (short && conf.score >= 12) return false;
  if (!short && conf.score <= -12) return false;
  if (state.position && state.position.side === state.config.direction) {
    const against =
      (state.position.side === "short" && state.biasScore >= 12) ||
      (state.position.side === "long" && state.biasScore <= -12);
    if (against) return false;
  }
  return true;
}

function huntTooClose(state, price){
  const need = Math.max(MIN_HUNT_GAP_PCT, effectiveHuntPct(state) * 0.9);
  for (const j of state.journal) {
    if (j.status !== "open" || j.source !== "\u0635\u0641\u0642\u0629") continue;
    if (j.entry > 0 && (Math.abs(price - j.entry) / j.entry) * 100 < need) return true;
  }
  const lastHunt = [...state.grid].reverse().find((g) => g.origin === "hunt" && g.status === "filled" && !g.reduceOnly);
  if (lastHunt && lastHunt.price > 0 && (Math.abs(price - lastHunt.price) / lastHunt.price) * 100 < need) return true;
  return false;
}

function effectiveHuntPct(state){
  const base = Math.max(0.18, state.config.huntPct);
  const mag = Math.abs(state.biasScore);
  const stalled = state.lastWorkAt != null && Date.now() - state.lastWorkAt > 90_000;
  const regime = state.regime ?? readRegime(state);
  const scaled = base * (isTradingEdition(state) ? regime.huntMult : 1);
  if (state.position && state.position.side !== state.config.direction) {
    return Math.max(0.08, scaled * 0.4);
  }
  if (stalled && huntAligned(state)) return Math.max(0.12, scaled * 0.55);
  if (mag >= 28 && huntAligned(state)) return Math.max(0.14, scaled * 0.75);
  return scaled;
}

function contractsForLevel(state, price){
  const { cycleBalance, leverage, levels } = state.config;
  const multiplier = state.multiplier || 520000;
  const contractValue = Math.max(1e-12, multiplier * price);
  const buyingPower = Math.max(0, cycleBalance) * Math.max(1, leverage);
  const perLevel = buyingPower / Math.max(1, levels);
  const raw = Math.max(1, Math.floor(perLevel / contractValue));
  if (!isTradingEdition(state)) return raw;
  const r = state.regime ?? readRegime(state);
  return Math.max(1, Math.floor(raw * r.sizeMult));
}

function buildGrid(state, center, wide = false){
  const { gridStepPct, levels, direction } = state.config;
  const tick = state.tickSize || 1e-10;
  const regime = isTradingEdition(state) ? (state.regime ?? readRegime(state)) : null;
  const step = (gridStepPct / 100) * (wide ? 4 : (regime?.stepMult ?? 1));
  const stepPct = wide ? Math.max(0.12, gridStepPct) * 4 : addStepPct(state);
  const qty = contractsForLevel(state, center);
  const grid = [];
  const addCount = Math.max(1, levels);
  const entry = state.position?.entry || center;
  const from = direction === "short" ? Math.max(center, entry) : Math.min(center, entry);

  for (let i = 1; i <= addCount; i += 1) {
    const raw = direction === "short" ? from * (1 + step * i) : from * (1 - step * i);
    const price = roundToTick(raw, tick);
    if (!(price > 0)) continue;
    if (grid.some((g) => tooClose(g.price, price, stepPct))) continue;
    if (direction === "short" && price <= center * (1 + step * 0.4)) continue;
    if (direction === "long" && price >= center * (1 - step * 0.4)) continue;
    grid.push({
      id: uid("lvl"),
      clientOid: uid("oid"),
      side: direction === "short" ? "sell" : "buy",
      price,
      qty,
      status: "armed",
      reduceOnly: false,
      exchangeOrderId: null,
      filledAt: null,
      filledPrice: null,
      origin: "grid",
      createdAt: Date.now(),
    });
  }
  return grid.sort((a, b) => b.price - a.price);
}

function entryZoneFromGrid(grid, center){
  const prices = grid.map((g) => g.price);
  if (prices.length === 0) return { low: center * 0.995, high: center * 1.005 };
  return { low: Math.min(...prices, center), high: Math.max(...prices, center) };
}

function pendingPlaceIntents(state){
  const stepPct = addStepPct(state);
  const armed = state.grid.filter((l) => l.status === "armed");
  const openPx = state.grid.filter((l) => l.status === "open" && !l.reduceOnly).map((l) => l.price);
  const spaced = armed.filter((l) => {
    if (l.reduceOnly) return true;
    if (openPx.some((p) => tooClose(p, l.price, stepPct))) return false;
    return true;
  });
  const list =
    state.status === "running"
      ? spaced
      : state.status === "paused"
        ? spaced.filter((l) => l.reduceOnly)
        : [];
  return list.map((l) => ({
    clientOid: l.clientOid,
    side: l.side,
    price: l.price,
    qty: l.qty,
    reduceOnly: l.reduceOnly,
    leverage: state.config.leverage,
    symbol: state.config.symbol,
  }));
}

function markLevelsOpen(state, placed){
  const next = cloneState(state);
  const byOid = new Map(placed.map((p) => [p.clientOid, p]));
  for (const level of next.grid) {
    const hit = byOid.get(level.clientOid);
    if (!hit || level.status !== "armed") continue;
    if (hit.orderId) {
      level.status = "open";
      level.exchangeOrderId = hit.orderId;
    } else if (hit.error) {
      next.lastError = hit.error;
      pushLog(next, "error", `\u0623\u0645\u0631 ${level.side} @ ${fmtPx(level.price)}: ${hit.error}`);
    }
  }
  next.lastWorkAt = Date.now();
  return next;
}

/* ---------- \u0627\u0644\u0645\u062d\u0631\u0643: \u0627\u0644\u062f\u0648\u0631\u0629 \u0648\u0627\u0644\u0627\u0646\u0639\u0643\u0627\u0633 ---------- */
function startCycle(state, price, recovered = false){
  const next = cloneState(state);
  next.lastError = null;
  next.lastWorkAt = Date.now();
  next.lastPrice = price;
  next.markPrice = price;
  next.huntAnchor = price;
  next.heartbeat = next.heartbeat || 0;
  if (!recovered && !next.position) {
    next.journal = [];
    next.cycles = [];
    next.cycleSeq = 0;
    next.activeCycle = null;
    next.openLot = null;
    next.huntCount = 0;
    next.huntOpen = 0;
    next.grid = [];
    next.gridAnchor = price;
    next.shieldFrozen = false;
    next.shieldReason = "";
    next.lastAddAt = null;
    next.addsHeldAt = 0;
    next.logs = next.logs.filter((l) => Date.now() - l.at < 8_000).slice(0, 4);
  }
  next.regime = readRegime(next);
  if (!next.position) {
    const hold = next.status;
    next.status = "idle";
    resolveDirection(next);
    next.status = hold;
  }
  next.status = "running";
  next.workers = 1;
  next.startedAt = Date.now();
  next.hunting = true;
  next.huntAnchor = price;
  next.gridAnchor = next.position?.entry || price;
  const ready = !isTradingEdition(next) || huntAligned(next);
  if (
    ready &&
    next.grid.filter((g) => !g.reduceOnly && (g.status === "armed" || g.status === "open")).length === 0
  ) {
    const center = next.position?.entry || price;
    next.grid = [
      ...next.grid.filter((g) => g.reduceOnly && (g.status === "open" || g.status === "armed")),
      ...buildGrid(next, center),
    ];
    next.gridAnchor = center;
    next.entryZone = entryZoneFromGrid(next.grid, center);
  }
  const dirLabel = next.config.direction === "short" ? "\u0634\u0648\u0631\u062a" : "\u0644\u0648\u0646\u063a";
  const regimeTxt = next.regime?.label ? ` \u00b7 ${next.regime.label}` : "";
  const why = next.biasReasons[0] ? ` \u2014 ${next.biasReasons[0]}` : "";
  if (recovered) {
    next.recoveredFromExchange = true;
    pushLog(next, "recover", "\u062a\u0645 \u0627\u0633\u062a\u0639\u0627\u062f\u0629 \u0627\u0644\u0635\u0641\u0642\u0629 \u0648\u0627\u0644\u0623\u0648\u0627\u0645\u0631 \u0645\u0646 \u0627\u0644\u0645\u0646\u0635\u0629 \u2014 \u0627\u0644\u0628\u0648\u062a \u064a\u0648\u0627\u0635\u0644 \u062f\u0648\u0646 \u062a\u0635\u0641\u064a\u0631");
  } else {
    pushLog(
      next,
      "server",
      `\u062f\u0648\u0631\u0629 \u062c\u062f\u064a\u062f\u0629 ${dirLabel}${regimeTxt} \u2014 \u0623\u0648\u0627\u0645\u0631 \u062d\u0633\u0628 \u0648\u0636\u0639 \u0627\u0644\u0633\u0648\u0642 \u0644\u0627 \u062f\u0641\u0639\u0629 \u0648\u0627\u062d\u062f\u0629${why}`,
    );
  }
  return next;
}

function pauseBot(state){
  const next = cloneState(state);
  next.status = "paused";
  next.workers = 0;
  next.hunting = false;
  for (const level of next.grid) {
    if (!level.reduceOnly && (level.status === "open" || level.status === "armed")) {
      level.status = "cancelled";
      level.exchangeOrderId = null;
    } else if (level.reduceOnly && level.status === "open" && next.config.mode === "live") {
      level.status = "armed";
      level.exchangeOrderId = null;
    }
  }
  pushLog(next, "info", "\u0625\u064a\u0642\u0627\u0641 \u0645\u0624\u0642\u062a \u2014 \u0644\u0627 \u0635\u0641\u0642\u0627\u062a \u062c\u062f\u064a\u062f\u0629. \u0627\u0644\u0627\u0646\u062a\u0638\u0627\u0631 \u062d\u062a\u0649 \u062c\u0646\u064a \u0631\u0628\u062d \u0627\u0644\u0635\u0641\u0642\u0627\u062a \u0627\u0644\u062d\u0627\u0644\u064a\u0629");
  return next;
}

function resumeBot(state){
  const next = cloneState(state);
  next.status = "running";
  next.workers = 1;
  next.lastError = null;
  next.hunting = true;
  next.huntAnchor = next.huntAnchor || next.lastPrice;
  const center = next.gridAnchor || next.position?.entry || next.lastPrice;
  const liveEntries = next.grid.filter(
    (g) => !g.reduceOnly && (g.status === "armed" || g.status === "open"),
  );
  if (liveEntries.length === 0 && center) {
    next.grid = [
      ...next.grid.filter((g) => g.reduceOnly && (g.status === "open" || g.status === "armed")),
      ...buildGrid(next, center),
    ];
    next.gridAnchor = center;
    next.entryZone = entryZoneFromGrid(next.grid, center);
  }
  pushLog(next, "info", "\u0627\u0633\u062a\u0626\u0646\u0627\u0641 \u2014 \u0627\u0644\u0634\u0628\u0643\u0629 \u0648\u0627\u0644\u0635\u064a\u062f \u0627\u0644\u0641\u0631\u062f\u064a \u064a\u0639\u0645\u0644\u0627\u0646 \u0645\u0639\u0627\u064b");
  return next;
}

function pushJournal(state, row){
  state.journal = [row, ...state.journal].slice(0, MAX_JOURNAL);
}

function compactOpenJournal(state){
  const opens = (state.journal ?? []).filter((j) => j.status === "open");
  if (opens.length === 0) return;
  const groups = new Map();
  for (const row of opens) {
    const list = groups.get(row.side) ?? [];
    list.push(row);
    groups.set(row.side, list);
  }
  const merged = [];
  for (const [side, rows] of groups) {
    if (rows.length === 0) continue;
    const qty = rows.reduce((s, r) => s + r.qty, 0);
    if (qty <= 0) continue;
    const weighted = rows.reduce((s, r) => s + r.entry * r.qty, 0) / qty;
    const pos = state.position && state.position.side === side ? state.position : null;
    const sources = new Set(rows.map((r) => r.source));
    const source = sources.size > 1 || sources.has("\u0645\u0631\u0643\u0632") ? "\u0645\u0631\u0643\u0632" : rows[0].source;
    const keep = {
      ...rows[0],
      entry: pos?.entry ?? weighted,
      qty: pos ? pos.size : qty,
      fees: rows.reduce((s, r) => s + r.fees, 0),
      mergedOrders: rows.reduce((s, r) => s + Math.max(1, r.mergedOrders), 0),
      source,
      openedAt: Math.min(...rows.map((r) => r.openedAt)),
      status: "open",
      exit: 0,
      pnl: 0,
      closedAt: 0,
    };
    merged.push(keep);
    for (const g of state.grid) {
      if (g.lotId && rows.some((r) => r.id === g.lotId)) g.lotId = keep.id;
    }
  }
  const closed = state.journal.filter((j) => j.status !== "open");
  state.journal = [...merged, ...closed].slice(0, MAX_JOURNAL);
  const live = merged[0];
  if (live && state.openLot) {
    state.openLot.entry = live.entry;
    state.openLot.qty = live.qty;
    state.openLot.mergedOrders = live.mergedOrders;
    state.openLot.fees = live.fees;
  }
}

function noteEntry(state, qty, price, fee, source){
  const side = state.position?.side ?? (source === "hunt" ? state.config.direction : "short");
  const label = source === "hunt" ? "\u0635\u0641\u0642\u0629" : "\u0634\u0628\u0643\u0629";
  if (!state.openLot) {
    state.openLot = {
      id: uid("tr"),
      side,
      qty,
      entry: price,
      openedAt: Date.now(),
      mergedOrders: 1,
      fees: fee,
      source,
    };
  } else {
    const total = state.openLot.qty + qty;
    state.openLot.entry = (state.openLot.entry * state.openLot.qty + price * qty) / total;
    state.openLot.qty = total;
    state.openLot.mergedOrders += 1;
    state.openLot.fees += fee;
  }
  const existing = state.journal.find((j) => j.status === "open" && j.side === side);
  if (existing) {
    const total = existing.qty + qty;
    existing.entry = (existing.entry * existing.qty + price * qty) / total;
    existing.qty = total;
    existing.mergedOrders += 1;
    existing.fees += fee;
    if (existing.source !== label) existing.source = "\u0645\u0631\u0643\u0632";
    if (state.position) existing.entry = state.position.entry;
    if (state.activeCycle) {
      state.activeCycle.fills += 1;
      state.activeCycle.entry = state.position?.entry ?? existing.entry;
    }
    compactOpenJournal(state);
    return existing.id;
  }
  const id = uid("jr");
  pushJournal(state, {
    id,
    source: label,
    side,
    qty,
    entry: price,
    exit: 0,
    pnl: 0,
    fees: fee,
    openedAt: Date.now(),
    closedAt: 0,
    mergedOrders: 1,
    status: "open",
  });
  if (!state.activeCycle) {
    state.cycleSeq += 1;
    state.activeCycle = {
      seq: state.cycleSeq,
      side,
      entry: state.position?.entry ?? price,
      openedAt: Date.now(),
      fills: 1,
      levels: state.config.levels,
      pnl: 0,
    };
  } else {
    state.activeCycle.fills += 1;
    if (state.position) state.activeCycle.entry = state.position.entry;
  }
  compactOpenJournal(state);
  return id;
}

function noteClose(state, qty, exit, fee, source, pnl, lotId){
  const lot = state.openLot;
  const side = lot?.side ?? state.position?.side ?? state.config.direction;
  const openRow =
    (lotId ? state.journal.find((j) => j.id === lotId && j.status === "open") : undefined) ??
    state.journal.find((j) => j.status === "open" && (source === "\u0625\u064a\u0642\u0627\u0641" || j.source === source)) ??
    state.journal.find((j) => j.status === "open");
  if (openRow) {
    const closeQty = Math.min(qty, openRow.qty);
    const entryShare = openRow.qty > 0 ? openRow.fees * (closeQty / openRow.qty) : openRow.fees;
    const net = lotNetPnl(openRow.side, openRow.entry, exit, closeQty, state.multiplier, entryShare + fee);
    if (closeQty >= openRow.qty - 1e-9) {
      openRow.status = "closed";
      openRow.exit = exit;
      openRow.pnl = net;
      openRow.fees += fee;
      openRow.closedAt = Date.now();
      if (source === "\u0625\u064a\u0642\u0627\u0641") openRow.source = "\u0625\u064a\u0642\u0627\u0641";
    } else {
      pushJournal(state, {
        id: uid("jr"),
        source,
        side: openRow.side,
        qty: closeQty,
        entry: openRow.entry,
        exit,
        pnl: net,
        fees: entryShare + fee,
        openedAt: openRow.openedAt,
        closedAt: Date.now(),
        mergedOrders: 1,
        status: "closed",
      });
      openRow.qty -= closeQty;
      openRow.fees = Math.max(0, openRow.fees - entryShare);
    }
    pnl = net;
  } else {
    pushJournal(state, {
      id: uid("jr"),
      source,
      side,
      qty,
      entry: lot?.entry ?? state.position?.entry ?? exit,
      exit,
      pnl,
      fees: fee,
      openedAt: lot?.openedAt ?? Date.now(),
      closedAt: Date.now(),
      mergedOrders: lot?.mergedOrders ?? 1,
      status: "closed",
    });
  }
  if (lot) {
    lot.qty -= qty;
    if (lot.qty <= 1e-9) state.openLot = null;
  }
  if (state.activeCycle) state.activeCycle.pnl += pnl;
  if (!state.position && state.activeCycle) {
    const reason = source === "\u0625\u064a\u0642\u0627\u0641" ? "\u0632\u0645\u0646\u064a" : pnl >= 0 || state.activeCycle.pnl >= 0 ? "\u0647\u062f\u0641" : "\u0632\u0645\u0646\u064a";
    sealCycle(state, exit, reason);
  }
}

function sealCycle(state, exit, reason){
  const c = state.activeCycle;
  if (!c || c.openedAt < 1e12) {
    state.activeCycle = null;
    return;
  }
  if (c.fills <= 0 && Math.abs(c.pnl) < 0.001) {
    state.activeCycle = null;
    return;
  }
  const row = {
    id: uid("cy"),
    seq: c.seq,
    side: c.side,
    fills: Math.max(1, c.fills),
    levels: c.levels,
    entry: c.entry,
    exit,
    pnl: c.pnl,
    openedAt: c.openedAt,
    closedAt: Date.now(),
    reason,
  };
  state.cycles = [row, ...state.cycles].slice(0, 80);
  state.activeCycle = null;
}

function flattenAt(state, price, source = "\u0625\u064a\u0642\u0627\u0641"){
  const next = cloneState(state);
  next.hunting = false;
  const pos = next.position;
  if (pos && price > 0) {
    const closeSide = pos.side === "short" ? "buy" : "sell";
    const notional = pos.size * next.multiplier * price;
    const fee = feeFor(next, notional, true);
    next.feesPaid += fee;
    const { realized, closedQty } = applyPositionDelta(next, closeSide, pos.size, price);
    if (closedQty > 0) {
      const openFees = next.journal.find((j) => j.status === "open")?.fees ?? 0;
      noteClose(next, closedQty, price, fee, source, netAfterFees(realized, openFees, fee));
    }
  }
  for (const row of next.journal) {
    if (row.status === "open") {
      row.status = "closed";
      row.exit = price;
      row.closedAt = Date.now();
      row.source = source;
      if (!row.pnl) {
        row.pnl = lotNetPnl(row.side, row.entry, price, row.qty, next.multiplier, row.fees);
      }
    }
  }
  next.position = null;
  next.openLot = null;
  next.huntOpen = 0;
  next.hunting = false;
  if (next.activeCycle) sealCycle(next, price, source === "\u0625\u064a\u0642\u0627\u0641" ? "\u0632\u0645\u0646\u064a" : "\u0625\u064a\u0642\u0627\u0641");
  for (const level of next.grid) {
    if (level.status === "open" || level.status === "armed") level.status = "cancelled";
  }
  return next;
}

function liqDanger(state, price){
  const pos = state.position;
  const liq = pos?.liquidation || state.liquidationPrice;
  if (!pos || !liq || !price) return false;
  if (pos.side === "long") return price <= liq * 1.015;
  return price >= liq * 0.985;
}

function reversalAgainst(state, price){
  if (!isTradingEdition(state) || !state.position) return false;
  const regime = state.regime ?? readRegime(state);
  const mom = state.confluence?.momentum ?? 0;
  const adv = adversePct(state, price);
  const long = state.position.side === "long";
  const trendAgainst = long ? regime.trend === "down" : regime.trend === "up";
  const momAgainst = long ? mom <= -0.1 : mom >= 0.1;
  const biasAgainst = long ? state.biasScore <= -8 : state.biasScore >= 8;
  if (trendAgainst && momAgainst && biasAgainst && adv >= 0.65) return true;
  if (trendAgainst && momAgainst && adv >= 1.4) return true;
  return false;
}

function escapeAdverse(state, price){
  if (state.status !== "running" || !state.position || !price) return state;
  if (!isTradingEdition(state)) return state;
  const danger = liqDanger(state, price);
  const flip = reversalAgainst(state, price);
  if (!danger && !flip) return state;
  const cooled = state.lastBiasFlipAt != null && Date.now() - state.lastBiasFlipAt < 45_000;
  if (cooled && !danger) return state;
  const was = state.position.side;
  const nextSide = was === "long" ? "short" : "long";
  const mode = state.config.directionMode ?? "auto";

  if (danger || mode !== "auto") {
    const next = flattenAt(state, price, "\u0645\u0631\u0643\u0632");
    if (mode === "auto") {
      next.config.direction = nextSide;
      next.grid = buildGrid(next, price, true).map((g) => ({ ...g, lane: "trend" }));
      next.hunting = true;
      next.huntAnchor = price;
      next.lastHuntAt = null;
      next.lastAddAt = null;
    }
    next.lastBiasFlipAt = Date.now();
    next.gridAnchor = price;
    next.shieldFrozen = false;
    next.shieldReason = "";
    if (!loggedRecently(next, "\u0642\u0631\u0628 \u0627\u0644\u062a\u0635\u0641\u064a\u0629", 20_000)) {
      pushLog(next, "server", `\u0642\u0631\u0628 \u0627\u0644\u062a\u0635\u0641\u064a\u0629 \u2014 \u0623\u064f\u063a\u0644\u0642 ${was === "long" ? "\u0627\u0644\u0644\u0648\u0646\u063a" : "\u0627\u0644\u0634\u0648\u0631\u062a"} \u0648\u062f\u062e\u0644 ${nextSide === "short" ? "\u0634\u0648\u0631\u062a" : "\u0644\u0648\u0646\u063a"} \u0628\u0634\u0628\u0643\u0629 \u0648\u0627\u0633\u0639\u0629`);
    }
    return next;
  }

  const next = cloneState(state);
  cancelPendingAdds(next);
  next.config.direction = was;
  const hold = buildGrid(next, price, true).map((g) => ({ ...g, lane: "hold" }));
  next.config.direction = nextSide;
  const trend = buildGrid(next, price, true).map((g) => ({ ...g, lane: "trend" }));
  const keep = next.grid.filter(
    (g) => g.status === "filled" || (g.reduceOnly && (g.status === "open" || g.status === "armed")),
  );
  next.grid = [...keep, ...hold, ...trend].sort((a, b) => b.price - a.price);
  next.hunting = true;
  next.huntAnchor = price;
  next.lastHuntAt = null;
  next.lastAddAt = null;
  next.lastBiasFlipAt = Date.now();
  next.gridAnchor = price;
  next.shieldFrozen = false;
  next.shieldReason = "";
  if (!loggedRecently(next, "\u0634\u0628\u0643\u062a\u064a\u0646", 20_000)) {
    pushLog(
      next,
      "server",
      `\u062a\u063a\u064a\u0651\u0631 \u0627\u0644\u0627\u062a\u062c\u0627\u0647 \u2014 \u062f\u062e\u0648\u0644 ${nextSide === "short" ? "\u0634\u0648\u0631\u062a" : "\u0644\u0648\u0646\u063a"} \u0641\u0648\u0631\u0627\u064b. \u0627\u0644\u0634\u0628\u0643\u0629 \u0627\u0644\u0642\u062f\u064a\u0645\u0629 \u062a\u0628\u0627\u0639\u062f\u062a\u060c \u0648\u0634\u0628\u0643\u0629 \u062c\u062f\u064a\u062f\u0629 \u0645\u0639 \u0627\u0644\u0627\u062a\u062c\u0627\u0647`,
    );
  }
  return next;
}

function closeLot(state, lotId, price){
  const next = cloneState(state);
  const row = next.journal.find((j) => j.id === lotId && j.status === "open");
  if (!row || !price) return next;
  const qty = row.qty;
  const closeSide = row.side === "short" ? "buy" : "sell";
  const notional = qty * next.multiplier * price;
  const fee = feeFor(next, notional, true);
  next.feesPaid += fee;
  if (next.position && next.position.side === row.side) {
    const { realized, closedQty } = applyPositionDelta(next, closeSide, qty, price);
    if (closedQty > 0) {
      noteClose(next, closedQty, price, fee, "\u0625\u064a\u0642\u0627\u0641", netAfterFees(realized, row.fees * (closedQty / qty), fee), lotId);
    }
  } else {
    noteClose(next, qty, price, fee, "\u0625\u064a\u0642\u0627\u0641", lotNetPnl(row.side, row.entry, price, qty, next.multiplier, row.fees + fee), lotId);
  }
  for (const g of next.grid) {
    if (g.lotId === lotId && (g.status === "open" || g.status === "armed" || (g.status === "filled" && !g.reduceOnly))) {
      if (g.reduceOnly || g.status === "armed" || g.status === "open") {
        g.status = "cancelled";
        g.exchangeOrderId = null;
      }
    }
  }
  if (row.source === "\u0635\u0641\u0642\u0629") next.huntOpen = Math.max(0, (next.huntOpen ?? 0) - 1);
  if (next.position && next.status === "running") syncPositionTp(next);
  pushLog(next, "info", `${pairTag(next)} \u00b7 \u0625\u063a\u0644\u0627\u0642 \u064a\u062f\u0648\u064a \u0644\u0635\u0641\u0642\u0629 ${row.side === "short" ? "\u0634\u0648\u0631\u062a" : "\u0644\u0648\u0646\u063a"} @ ${fmtPx(price)}`);
  next.ignoreExchangePosUntil = Date.now() + 12_000;
  return next;
}

function stopBot(state, price = state.lastPrice){
  const px = price || state.lastPrice || state.markPrice || 0;
  const next = flattenAt(state, px, "\u0625\u064a\u0642\u0627\u0641");
  next.status = "stopped";
  next.workers = 0;
  next.hunting = false;
  pushLog(next, "info", "\u0625\u064a\u0642\u0627\u0641 \u2014 \u0623\u064f\u063a\u0644\u0642\u062a \u0643\u0644 \u0627\u0644\u0635\u0641\u0642\u0627\u062a \u0648\u062c\u064f\u0646\u064a \u0627\u0644\u0631\u0628\u062d/\u0627\u0644\u062e\u0633\u0627\u0631\u0629 \u0639\u0644\u0649 \u0627\u0644\u0633\u0639\u0631 \u0627\u0644\u062d\u0627\u0644\u064a");
  return next;
}

/* ---------- \u0627\u0644\u0645\u062d\u0631\u0643: \u0627\u0644\u0631\u0633\u0648\u0645 \u0648\u0627\u0644\u062a\u0639\u0628\u0626\u0629 ---------- */
function fmtPx(n){
  if (!n) return "0";
  if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (n >= 1) return n.toFixed(2);
  const s = n.toFixed(12).replace(/0+$/, "").replace(/\.$/, "");
  return s;
}

function feeFor(state, notional, taker){
  return notional * (taker ? state.takerFee : state.makerFee);
}

function roundTripRate(state){
  return Math.max(0, state.makerFee) + Math.max(0, state.takerFee);
}

function netAfterFees(gross, entryFee, exitFee){
  return gross - entryFee - exitFee;
}

function applyPositionDelta(state, side, qty, price){
  const dir = side === "sell" ? "short" : "long";
  if (!state.position) {
    state.position = {
      side: dir,
      size: qty,
      entry: price,
      leverage: state.config.leverage,
      unrealized: 0,
      openedAt: Date.now(),
      liquidation: null,
    };
    return { realized: 0, closedQty: 0, addedQty: qty };
  }
  const same =
    (state.position.side === "short" && side === "sell") ||
    (state.position.side === "long" && side === "buy");
  if (same) {
    const total = state.position.size + qty;
    state.position.entry = (state.position.entry * state.position.size + price * qty) / total;
    state.position.size = total;
    return { realized: 0, closedQty: 0, addedQty: qty };
  }
  const closeQty = Math.min(qty, state.position.size);
  const sign = state.position.side === "short" ? 1 : -1;
  const pnlPer = sign * (state.position.entry - price) * state.multiplier;
  const pnl = pnlPer * closeQty;
  state.realizedPnl += pnl;
  state.gridPnl += pnl;
  state.position.size -= closeQty;
  if (state.position.size <= 1e-9) {
    state.position = null;
  }
  const leftover = qty - closeQty;
  if (leftover > 1e-9) {
    state.position = {
      side: dir,
      size: leftover,
      entry: price,
      leverage: state.config.leverage,
      unrealized: 0,
      openedAt: Date.now(),
      liquidation: null,
    };
    return { realized: pnl, closedQty: closeQty, addedQty: leftover };
  }
  return { realized: pnl, closedQty: closeQty, addedQty: 0 };
}

function placeTpOpposite(state, filled){
  if (state.status !== "running") return;
  const notional = Math.max(1e-9, filled.qty * state.multiplier * filled.price);
  const coverPct = (roundTripRate(state) + MIN_NET_USD / notional) * 100;
  const px = state.lastPrice || filled.price;
  const underwater = Boolean(state.position && adversePct(state, px) >= 0.35);
  const stepPct = underwater ? Math.max(0.04, coverPct * 0.5) : Math.max(coverPct, filled.origin === "hunt" ? 0.22 : 0.24);
  const step = stepPct / 100;
  const tick = state.tickSize || 1e-10;
  const tpPrice =
    filled.side === "sell"
      ? roundToTick(filled.price * (1 - step), tick)
      : roundToTick(filled.price * (1 + step), tick);
  const exists = state.grid.some(
    (g) =>
      (g.status === "armed" || g.status === "open") &&
      g.reduceOnly &&
      Math.abs(g.price - tpPrice) / tpPrice < 1e-6,
  );
  if (exists) return;
  state.grid.push({
    id: uid("tp"),
    clientOid: uid("oid"),
    side: filled.side === "sell" ? "buy" : "sell",
    price: tpPrice,
    qty: filled.qty,
    status: "armed",
    reduceOnly: true,
    exchangeOrderId: null,
    filledAt: null,
    filledPrice: null,
    origin: filled.origin ?? "grid",
    createdAt: Date.now(),
    lotId: filled.lotId,
  });
  state.grid.sort((a, b) => b.price - a.price);
}

function fillLevel(state, levelId, fillPrice, taker){
  const next = cloneState(state);
  const level = next.grid.find((g) => g.id === levelId);
  if (!level || level.status === "filled") return next;
  if (!level.reduceOnly && coveringLoser(next, level, fillPrice)) return next;
  level.status = "filled";
  level.filledAt = Date.now();
  level.filledPrice = fillPrice;
  const notional = level.qty * next.multiplier * fillPrice;
  const fee = feeFor(next, notional, taker);
  next.feesPaid += fee;
  const delta = applyPositionDelta(next, level.side, level.qty, fillPrice);
  if (delta.addedQty > 0) {
    const lotId = noteEntry(next, delta.addedQty, fillPrice, fee, level.origin === "hunt" ? "hunt" : "grid");
    level.lotId = level.lotId || lotId;
  }
  if (delta.closedQty > 0) {
    const source = level.origin === "hunt" ? "\u0635\u0641\u0642\u0629" : "\u0634\u0628\u0643\u0629";
    const openFees = (level.lotId ? next.journal.find((j) => j.id === level.lotId) : undefined)?.fees ?? 0;
    const lotRow = level.lotId ? next.journal.find((j) => j.id === level.lotId) : undefined;
    const net = lotRow
      ? lotNetPnl(lotRow.side, lotRow.entry, fillPrice, lotRow.qty, next.multiplier, lotRow.fees + fee)
      : netAfterFees(delta.realized, openFees, fee);
    noteClose(next, delta.closedQty, fillPrice, fee, source, net, level.lotId);
    if (level.origin === "hunt" && level.reduceOnly) {
      next.huntOpen = Math.max(0, (next.huntOpen ?? 0) - 1);
    }
    const parent = next.grid.find(
      (g) => !g.reduceOnly && g.status === "filled" && (level.lotId ? g.lotId === level.lotId : g.origin === level.origin),
    );
    if (parent) parent.status = "cancelled";
    next.huntAnchor = fillPrice;
    next.hunting = next.status === "running";
    next.lastHuntAt = Date.now() - 400;
  }
  if (next.position && next.status === "running") syncPositionTp(next);
  next.lastWorkAt = Date.now();
  pushFill(
    next,
    `${pairTag(next)} \u00b7 ${level.side === "sell" ? "\u0628\u064a\u0639" : "\u0634\u0631\u0627\u0621"} ${level.origin === "hunt" ? "\u0635\u0641\u0642\u0629 \u0641\u0631\u062f\u064a\u0629" : level.reduceOnly ? "\u062c\u0646\u064a \u0634\u0628\u0643\u0629" : "\u0634\u0628\u0643\u0629"} @ ${fmtPx(fillPrice)}`,
  );
  return next;
}

function coveringLoser(state, level, price){
  const pos = state.position;
  if (!pos || level.reduceOnly) return false;
  const cover = (pos.side === "short" && level.side === "buy") || (pos.side === "long" && level.side === "sell");
  if (!cover) return false;
  return adversePct(state, price) > 0.08;
}

function pushFill(state, text){
  if (loggedRecently(state, text, 8_000)) return;
  pushLog(state, "fill", text);
}

function selectDueAdds(state, due, price){
  if (addsBlocked(state, price)) return [];
  if (state.position && isTradingEdition(state) && !inAddZone(state, price)) return [];
  const adds = due
    .filter((l) => !l.reduceOnly && !coveringLoser(state, l, price))
    .sort((a, b) => Math.abs(a.price - price) - Math.abs(b.price - price));
  if (!isTradingEdition(state)) return adds;
  const now = Date.now();
  const allowed = adds.filter((l) => {
    if (state.startedAt && now - state.startedAt < SCOUT_MS && filledAdds(state) >= 1) return false;
    if (state.lastAddAt && now - state.lastAddAt < ADD_COOLDOWN_MS) return false;
    return true;
  });
  return allowed.slice(0, 1);
}

function shouldFill(level, price){
  if (level.status !== "open" && level.status !== "armed") return false;
  if (level.side === "sell") return price >= level.price;
  return price <= level.price;
}

function syncPositionTp(state){
  if (state.status !== "running" || !state.position) return;
  for (const g of state.grid) {
    if (g.reduceOnly && (g.status === "armed" || g.status === "open")) g.status = "cancelled";
  }
  const pos = state.position;
  const open = state.journal.find((j) => j.status === "open");
  const dummy = {
    id: uid("avg"),
    clientOid: uid("oid"),
    side: pos.side === "short" ? "sell" : "buy",
    price: pos.entry,
    qty: pos.size,
    status: "filled",
    reduceOnly: false,
    exchangeOrderId: null,
    filledAt: Date.now(),
    filledPrice: pos.entry,
    origin: state.openLot?.source === "grid" && open?.source === "\u0634\u0628\u0643\u0629" ? "grid" : "hunt",
    createdAt: Date.now(),
    lotId: open?.id,
  };
  placeTpOpposite(state, dummy);
}

function trailHuntAnchor(state, price){
  if (!price || state.status !== "running") return;
  if (!state.hunting) state.hunting = true;
  if (!state.huntAnchor) {
    state.huntAnchor = price;
    return;
  }
  if (state.config.direction === "short") {
    if (price > state.huntAnchor) state.huntAnchor = price;
  } else if (price < state.huntAnchor) {
    state.huntAnchor = price;
  }
}

function huntTrigger(state, price){
  if (state.status !== "running") return null;
  if (!price) return null;
  const flipping = Boolean(state.position && state.config.direction !== state.position.side);
  if (addsBlocked(state, price) && !flipping) return null;
  if (flipping) {
    if (state.lastHuntAt && Date.now() - state.lastHuntAt < 120_000) return null;
    if (!state.hunting) return null;
    return packHunt(state, price);
  }
  if (state.position && isTradingEdition(state)) {
    if (!inAddZone(state, price)) return null;
  } else if (!huntAligned(state)) {
    return null;
  }
  if (isTradingEdition(state) && state.startedAt && Date.now() - state.startedAt < SCOUT_MS && filledAdds(state) >= 1) {
    return null;
  }
  if (isTradingEdition(state) && state.lastAddAt && Date.now() - state.lastAddAt < ADD_COOLDOWN_MS) return null;
  const stalled = !state.lastWorkAt || Date.now() - state.lastWorkAt > 90_000;
  if (stalled && state.huntAnchor && Math.abs(price - state.huntAnchor) / state.huntAnchor > 0.008) {
    state.huntAnchor = price;
  }
  trailHuntAnchor(state, price);
  if (!state.hunting || !state.huntAnchor) return null;
  if (state.lastHuntAt && Date.now() - state.lastHuntAt < HUNT_COOLDOWN_MS) return null;
  if (openHuntLots(state) >= MAX_HUNT_OPEN) return null;
  if (huntTooClose(state, price)) return null;
  if (state.position && isTradingEdition(state)) {
    const packed = packHunt(state, price);
    const cover =
      (state.position.side === "short" && packed.side === "buy") ||
      (state.position.side === "long" && packed.side === "sell");
    if (cover) return null;
    return packed;
  }
  const pct = ((price - state.huntAnchor) / state.huntAnchor) * 100;
  const need = effectiveHuntPct(state);
  const short = state.config.direction === "short";
  const hitNeed = short ? pct <= -need : pct >= need;
  if (!hitNeed) return null;
  return packHunt(state, price);
}

function packHunt(state, price){
  return {
    side: state.config.direction === "short" ? "sell" : "buy",
    qty: contractsForLevel(state, price),
  };
}

function pendingHunt(state, price){
  return huntTrigger(state, price);
}

function pruneGhostLevels(state){
  const filledHunt = state.grid.filter((g) => g.origin === "hunt" && g.status === "filled" && !g.reduceOnly).length;
  state.huntOpen = Math.min(state.huntOpen ?? 0, filledHunt);
  if (state.position) return;
  state.huntOpen = 0;
  for (const g of state.grid) {
    if (g.reduceOnly && (g.status === "open" || g.status === "armed")) g.status = "cancelled";
    if (g.status === "filled" && !g.reduceOnly) g.status = "cancelled";
    if (g.status === "open" && !g.reduceOnly && !g.filledAt) g.status = "armed";
  }
  for (const row of state.journal) {
    if (row.status !== "open") continue;
    row.status = "closed";
    row.exit = state.lastPrice || row.entry;
    row.closedAt = Date.now();
    if (row.pnl === 0 && row.exit && row.entry) {
      const sign = row.side === "short" ? 1 : -1;
      row.pnl = sign * (row.entry - row.exit) * state.multiplier * row.qty - row.fees;
    }
  }
  state.openLot = null;
}

function ensureGrid(state){
  if (state.status !== "running") return state;
  const center = state.lastPrice || state.gridAnchor || state.position?.entry;
  if (!center) return state;
  const next0 = cloneState(state);
  sanitizeAdds(next0);
  const dual =
    next0.grid.some((g) => g.lane === "hold" && (g.status === "armed" || g.status === "open")) &&
    next0.grid.some((g) => g.lane === "trend" && (g.status === "armed" || g.status === "open"));
  if (dual) {
    if (next0.position) syncPositionTp(next0);
    return next0;
  }
  if (filledAdds(next0) >= Math.max(1, next0.config.levels)) {
    for (const g of next0.grid) {
      if (g.lane === "trend" || g.reduceOnly || g.filledAt) continue;
      if (g.status === "armed" || g.status === "open") {
        g.status = "cancelled";
        g.exchangeOrderId = null;
      }
    }
    if (next0.position) syncPositionTp(next0);
    return next0;
  }
  const sameSide = Boolean(next0.position && next0.position.side === next0.config.direction);
  const short = next0.position?.side === "short";
  const chasing =
    Boolean(sameSide && next0.gridAnchor) &&
    ((short && center > next0.gridAnchor) || (!short && center < next0.gridAnchor));
  const jump = lastJumpPct(next0);
  const live = next0.grid.filter((g) => !g.reduceOnly && (g.status === "armed" || g.status === "open"));
  const step = Math.max(0.0005, next0.config.gridStepPct / 100);
  const drift = next0.gridAnchor ? Math.abs(center - next0.gridAnchor) / next0.gridAnchor : 1;
  const empty = live.length === 0;
  const away = drift > step * 2.2;
  const r = next0.regime ?? readRegime(next0);
  if (r.shock && !empty && next0.position) {
    cancelPendingAdds(next0);
    if (next0.position) syncPositionTp(next0);
    return next0;
  }
  const mom = next0.confluence?.momentum ?? 0;
  const against =
    Boolean(next0.position) &&
    isTradingEdition(next0) &&
    ((next0.position?.side === "long" && r.trend === "down" && mom < -0.06) ||
      (next0.position?.side === "short" && r.trend === "up" && mom > 0.06));
  if (against) {
    for (const g of next0.grid) {
      if (g.lane || g.reduceOnly) continue;
      if (g.status === "armed" || g.status === "open") {
        g.status = "cancelled";
        g.exchangeOrderId = null;
      }
    }
    if (next0.position) syncPositionTp(next0);
    return next0;
  }
  if (chasing && jump > 0.18) return next0;
  if (!empty && !away && jump < 0.12) return next0;
  if (chasing) {
    const paused = jump > 0.02 && jump < 0.16;
    if (!(isTradingEdition(next0) && paused && inAddZone(next0, center))) return next0;
  }
  if (next0.position && isTradingEdition(next0) && !inAddZone(next0, center) && !empty) {
    if (next0.position) syncPositionTp(next0);
    return next0;
  }
  const next = next0;
  cancelPendingAdds(next);
  const keep = next.grid.filter(
    (g) => g.status === "filled" || g.status === "cancelled" || (g.reduceOnly && (g.status === "open" || g.status === "armed")),
  );
  next.grid = [...keep, ...buildGrid(next, center)].filter((g) => {
    if (keep.includes(g) || g.reduceOnly || g.status !== "armed") return true;
    return !shouldFill(g, center);
  });
  next.gridAnchor = center;
  next.entryZone = entryZoneFromGrid(next.grid, center);
  next.grid.sort((a, b) => b.price - a.price);
  if (!loggedRecently(next, "\u0627\u0644\u0645\u062a\u0648\u0633\u0637", 25_000) && next.position) {
    pushLog(next, "server", "\u0645\u0646\u0637\u0642\u0629 \u0625\u0636\u0627\u0641\u0629 \u2014 \u062a\u0639\u062f\u064a\u0644 \u0627\u0644\u0645\u062a\u0648\u0633\u0637 \u062b\u0645 \u0627\u0644\u062c\u0646\u064a");
  } else if (!next.position && !loggedRecently(next, "\u0627\u0644\u0634\u0628\u0643\u0629", 20_000)) {
    pushLog(next, "server", empty ? "\u0627\u0644\u0634\u0628\u0643\u0629 \u0645\u0633\u062a\u0642\u0644\u0629 \u2014 \u0623\u064f\u0639\u064a\u062f \u062a\u0633\u0644\u064a\u062d \u0627\u0644\u0645\u0633\u062a\u0648\u064a\u0627\u062a \u062d\u0648\u0644 \u0627\u0644\u0633\u0639\u0631" : "\u0627\u0644\u0634\u0628\u0643\u0629 \u062a\u062a\u0628\u0639 \u0627\u0644\u0633\u0639\u0631 \u2014 \u0623\u064f\u0639\u064a\u062f \u062a\u0648\u0632\u064a\u0639 \u0627\u0644\u0645\u0633\u062a\u0648\u064a\u0627\u062a");
  }
  return next;
}

function maybeHunt(state, price){
  const hit = huntTrigger(state, price);
  if (!hit) return state;
  const next = cloneState(state);
  next.hunting = true;
  next.lastHuntAt = Date.now();
  next.huntAnchor = price;
  const notional = hit.qty * next.multiplier * price;
  const fee = feeFor(next, notional, true);
  next.feesPaid += fee;
  const delta = applyPositionDelta(next, hit.side, hit.qty, price);
  if (delta.closedQty > 0) {
    const openFees = next.journal.find((j) => j.status === "open")?.fees ?? 0;
    noteClose(next, delta.closedQty, price, fee, "\u0635\u0641\u0642\u0629", netAfterFees(delta.realized, openFees, fee));
    next.huntOpen = Math.max(0, (next.huntOpen ?? 0) - 1);
    pushLog(next, "fill", `\u0643\u0633\u0631 \u0645\u062a\u0648\u0633\u0637 \u0635\u0641\u0642\u0629 \u0645\u0639\u0644\u0651\u0642\u0629 \u2014 ${hit.side === "buy" ? "\u0634\u0631\u0627\u0621" : "\u0628\u064a\u0639"} @ ${fmtPx(price)}`);
  }
  if (delta.addedQty > 0) {
    next.huntCount += 1;
    next.huntOpen = (next.huntOpen ?? 0) + 1;
    const lotId = noteEntry(next, delta.addedQty, price, fee, "hunt");
    next.grid.push({
      id: uid("hunt"),
      clientOid: uid("oid"),
      side: hit.side,
      price,
      qty: delta.addedQty,
      status: "filled",
      reduceOnly: false,
      exchangeOrderId: null,
      filledAt: Date.now(),
      filledPrice: price,
      origin: "hunt",
      createdAt: Date.now(),
      lotId,
    });
    pushFill(
      next,
      `${pairTag(next)} \u00b7 \u0635\u0641\u0642\u0629 \u0641\u0631\u062f\u064a\u0629 #${next.huntCount} \u2014 ${hit.side === "sell" ? "\u0628\u064a\u0639" : "\u0634\u0631\u0627\u0621"} @ ${fmtPx(price)}`,
    );
  }
  if (next.position && next.status === "running") syncPositionTp(next);
  next.lastWorkAt = Date.now();
  if (delta.addedQty > 0) next.lastAddAt = Date.now();
  return next;
}

function harvestRipe(state, price){
  if (!price || state.status === "idle") return state;
  let next = state;
  const tps = next.grid.filter((g) => g.reduceOnly && (g.status === "open" || g.status === "armed"));
  for (const tp of tps) {
    if (tp.status === "filled" || tp.status === "cancelled") continue;
    const live = next.grid.find((g) => g.id === tp.id);
    if (!live || live.status === "filled") continue;
    const lot = live.lotId ? next.journal.find((j) => j.id === live.lotId) : undefined;
    const entry = lot?.entry ?? next.position?.entry ?? live.price;
    const side = lot?.side ?? next.position?.side ?? next.config.direction;
    const sign = side === "short" ? 1 : -1;
    const pnl = sign * (entry - price) * next.multiplier * live.qty;
    const exitFee = feeFor(next, live.qty * next.multiplier * price, true);
    const entryFee = lot?.fees ?? feeFor(next, live.qty * next.multiplier * entry, false);
    const net = netAfterFees(pnl, entryFee, exitFee);
    const hit = shouldFill(live, price);
    const stuck = Boolean(state.position && adversePct(state, price) >= 0.45);
    const minNet = stuck ? 0.04 : MIN_NET_USD;
    if (net < minNet) continue;
    const ripe = hit || net >= minNet * 1.15;
    if (!ripe) continue;
    next = fillLevel(next, live.id, price, true);
  }
  return next;
}

function markUnrealized(state, price){
  if (state.position) {
    const sign = state.position.side === "short" ? 1 : -1;
    state.position.unrealized =
      sign * (state.position.entry - price) * state.multiplier * state.position.size;
  }
  refreshLiquidation(state);
}

function liveEquity(state){
  return state.config.cycleBalance + state.realizedPnl + (state.position?.unrealized ?? 0) - state.feesPaid;
}

function maintMarginForLeverage(leverage, fromExchange){
  if (fromExchange && fromExchange > 0 && fromExchange < 0.25) return fromExchange;
  if (leverage >= 75) return 0.025;
  if (leverage >= 50) return 0.012;
  if (leverage >= 25) return 0.008;
  if (leverage >= 10) return 0.005;
  return 0.004;
}

function computeLiquidation(state){
  const dir = state.position?.side ?? state.config.direction;
  const pending = state.grid.filter((g) => {
    if (g.reduceOnly || g.status !== "open") return false;
    return dir === "short" ? g.side === "sell" : g.side === "buy";
  });
  const posQty = state.position?.size ?? 0;
  const pendQty = pending.reduce((s, g) => s + g.qty, 0);
  const qty = posQty + pendQty;
  if (qty <= 0) return null;
  const pendPx = pending.reduce((s, g) => s + g.price * g.qty, 0);
  const entry =
    posQty > 0 ? ((state.position.entry * posQty + pendPx) / qty) : pendQty > 0 ? pendPx / pendQty : 0;
  if (!entry) return null;
  const mult = state.multiplier || 1;
  const lev = Math.max(1, state.position?.leverage || state.config.leverage);
  const mmr = maintMarginForLeverage(lev, state.maintMarginRate);
  const liqFee = Math.max(state.takerFee || 0, 0.0005);
  const notional = entry * qty * mult;
  const wallet = Math.max(
    0,
    state.config.cycleBalance + state.realizedPnl - state.feesPaid + (state.position?.unrealized ?? 0),
  );
  if (dir === "long") {
    const den = qty * mult * (1 - mmr - liqFee);
    if (den <= 0) return null;
    const margin = Math.min(wallet, notional * (1 - mmr - liqFee - 0.002));
    const lp = (notional - margin) / den;
    return lp > 0 ? lp : null;
  }
  const den = qty * mult * (1 + mmr + liqFee);
  if (den <= 0) return null;
  return (notional + wallet) / den;
}

function refreshLiquidation(state){
  const pendingArmed = state.grid.some(
    (g) => !g.reduceOnly && g.status === "armed" && !g.exchangeOrderId,
  );
  const local = computeLiquidation(state);
  if (state.exchangeLiqPrice && state.exchangeLiqPrice > 0 && !pendingArmed) {
    state.liquidationPrice = state.exchangeLiqPrice;
  } else {
    state.liquidationPrice = local;
  }
  if (state.position) state.position.liquidation = state.liquidationPrice;
  state.maintMarginRate = maintMarginForLeverage(state.config.leverage, state.maintMarginRate);
}

function tickPaper(state, market){
  if (state.status === "paused") {
    let next = cloneState(state);
    applyMarketMeta(next, market);
    next.connected = true;
    next.workers = 0;
    next.hunting = false;
    next = harvestRipe(next, market.price);
    const due = next.grid.filter((l) => shouldFill(l, market.price));
    for (const level of due) {
      next = fillLevel(next, level.id, level.price, false);
    }
    pruneGhostLevels(next);
    markUnrealized(next, market.price);
    return next;
  }
  if (state.status !== "running") {
    const idle = cloneState(state);
    applyMarketMeta(idle, market);
    idle.connected = true;
    resolveDirection(idle);
    return idle;
  }
  let next = cloneState(state);
  next.heartbeat += 1;
  next.workers = 1;
  next.connected = true;
  next.lastError = null;
  compactOpenJournal(next);
  applyMarketMeta(next, market);
  resolveDirection(next);
  pruneGhostLevels(next);

  next.shieldFrozen = false;
  next.shieldReason = "";

  next = escapeAdverse(next, market.price);
  next = harvestRipe(next, market.price);
  const due = next.grid.filter((l) => shouldFill(l, market.price));
  const jump = lastJumpPct(next);
  if (jump > 0.45 && !loggedRecently(next, "\u0641\u062c\u0648\u0629", 20_000)) {
    pushLog(next, "server", `\u0641\u062c\u0648\u0629 ${jump.toFixed(2)}\u066a \u2014 \u062a\u0639\u0628\u0626\u0629 \u0623\u0642\u0631\u0628 \u0645\u0633\u062a\u0648\u0649 \u0641\u0642\u0637`);
  }
  for (const level of selectDueAdds(next, due, market.price)) {
    const before = filledAdds(next);
    next = fillLevel(next, level.id, level.price, false);
    if (filledAdds(next) > before) next.lastAddAt = Date.now();
  }
  next.hunting = true;
  next = maybeHunt(next, market.price);
  next = ensureGrid(next);
  next = harvestRipe(next, market.price);
  pruneGhostLevels(next);

  markUnrealized(next, market.price);
  if (next.grid.length && !next.entryZone) {
    next.entryZone = entryZoneFromGrid(next.grid, market.price);
  }
  return next;
}

function reconcileWithExchange(state, ex){
  const next = cloneState(state);
  next.lastPrice = ex.price;
  next.markPrice = ex.markPrice;
  next.exchangeBalance = ex.balance;
  next.makerFee = ex.makerFee;
  next.takerFee = ex.takerFee;
  next.funding = ex.funding;
  next.multiplier = ex.multiplier;
  next.tickSize = ex.tickSize;
  next.connected = true;
  next.lastServerTickAt = Date.now();
  if (ex.orderBook) next.orderBook = ex.orderBook;
  if (ex.tape) next.tape = ex.tape;
  if (ex.price > 0) {
    next.priceTrail = [...next.priceTrail, ex.price].slice(-MAX_TRAIL);
    next.emaFast = nextEma(next.emaFast, ex.price, 9);
    next.emaSlow = nextEma(next.emaSlow, ex.price, 21);
  }

  if (ex.position) {
    if (next.ignoreExchangePosUntil && Date.now() < next.ignoreExchangePosUntil && !next.position) {
      // \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0623\u063a\u0644\u0642 \u0644\u0644\u062a\u0648 \u2014 \u0644\u0627 \u062a\u064f\u0639\u0627\u062f \u0635\u0641\u0642\u0629 \u0627\u0644\u0645\u0646\u0635\u0629
    } else if (!next.position) {
      next.position = ex.position;
      next.recoveredFromExchange = true;
      next.hunting = false;
      pushLog(
        next,
        "recover",
        `\u0627\u0633\u062a\u0639\u0627\u062f\u0629 \u0635\u0641\u0642\u0629 ${ex.position.side === "short" ? "\u0634\u0648\u0631\u062a" : "\u0644\u0648\u0646\u063a"} \u00d7${ex.position.leverage} \u0645\u0646 \u0627\u0644\u0645\u0646\u0635\u0629`,
      );
    } else {
      next.position.size = ex.position.size;
      next.position.entry = ex.position.entry;
      next.position.unrealized = ex.position.unrealized;
      next.position.side = ex.position.side;
      if (ex.position.liquidation) next.position.liquidation = ex.position.liquidation;
    }
  } else if (ex.positionOk === false) {
    // \u0641\u0634\u0644 \u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0645\u0646\u0635\u0629 \u2014 \u064a\u0628\u0642\u0649 \u0627\u0644\u0645\u0631\u0643\u0632 \u0627\u0644\u0645\u062d\u0644\u064a\u060c \u0644\u0627 \u062a\u0635\u0641\u064a\u0631
  } else if (next.position && next.config.mode === "live") {
    next.position = null;
  }
  if (ex.liquidationPrice != null) next.exchangeLiqPrice = ex.liquidationPrice;
  if (ex.maintMarginRate != null && ex.maintMarginRate > 0) next.maintMarginRate = ex.maintMarginRate;

  if (ex.ordersOk === false) {
    if (next.position) markUnrealized(next, ex.price);
    else refreshLiquidation(next);
    resolveDirection(next);
    return next;
  }

  const byOid = new Map(ex.openOrders.map((o) => [o.clientOid ?? "", o]));
  const byId = new Map(ex.openOrders.map((o) => [o.orderId, o]));

  for (const level of next.grid) {
    const match =
      (level.clientOid && byOid.get(level.clientOid)) ||
      (level.exchangeOrderId && byId.get(level.exchangeOrderId));
    if (match) {
      level.status = "open";
      level.exchangeOrderId = match.orderId;
    } else if (level.status === "open" && next.config.mode === "live") {
      if (shouldFill({ ...level, status: "open" }, ex.price)) {
        // \u062a\u0639\u0628\u0626\u0629 \u0645\u062d\u0644\u064a\u0629 \u0639\u0628\u0631 applyCrossedFills
      } else {
        level.status = "armed";
        level.exchangeOrderId = null;
      }
    }
  }

  for (const order of ex.openOrders) {
    if (next.ignoreExchangePosUntil && Date.now() < next.ignoreExchangePosUntil && !next.position) break;
    const known = next.grid.some(
      (l) => l.exchangeOrderId === order.orderId || (order.clientOid && l.clientOid === order.clientOid),
    );
    if (known) continue;
    next.grid.push({
      id: uid("ex"),
      clientOid: order.clientOid || uid("oid"),
      side: order.side,
      price: order.price,
      qty: order.size,
      status: "open",
      reduceOnly: order.reduceOnly,
      exchangeOrderId: order.orderId,
      filledAt: null,
      filledPrice: null,
      origin: "grid",
    });
    next.recoveredFromExchange = true;
  }

  if (next.grid.length === 0 && next.position && next.status === "running") {
    next.config.direction = next.position.side;
    next.grid = buildGrid(next, next.position.entry || ex.price);
    next.entryZone = entryZoneFromGrid(next.grid, ex.price);
    pushLog(next, "recover", "\u0623\u064f\u0639\u064a\u062f \u0628\u0646\u0627\u0621 \u0627\u0644\u0634\u0628\u0643\u0629 \u062d\u0648\u0644 \u0635\u0641\u0642\u0629 \u0627\u0644\u0645\u0646\u0635\u0629");
  }

  next.grid.sort((a, b) => b.price - a.price);
  if (next.position) markUnrealized(next, ex.price);
  else refreshLiquidation(next);
  resolveDirection(next);
  return next;
}

function applyCrossedFills(state, price){
  let next = cloneState(state);
  next.shieldFrozen = false;
  next.shieldReason = "";
  next = escapeAdverse(next, price);
  next = harvestRipe(next, price);
  const due = [...next.grid].filter((level) => shouldFill(level, price));
  for (const level of selectDueAdds(next, due, price)) {
    next = fillLevel(next, level.id, level.price, false);
  }
  return next;
}

function publicSnapshot(state){
  return cloneState(state);
}

function formatUsd(n, digits = 2){
  const abs = Math.abs(n);
  const sign = n < 0 ? "-" : n > 0 ? "+" : "";
  if (abs >= 1000000) return `${sign}${(n / 1000000).toFixed(2)}M`;
  return `${sign}${n.toFixed(digits)}`;
}

function deskSummary(state){
  const journal = state.journal ?? [];
  const liveFilled = state.grid.filter((g) => g.status === "filled" && !g.reduceOnly);
  const gridOpen = liveFilled.filter((g) => g.origin !== "hunt").length;
  const tradeOpen = liveFilled.filter((g) => g.origin === "hunt").length;
  const gridPend = state.grid.filter(
    (g) => g.reduceOnly && (g.status === "armed" || g.status === "open") && g.origin !== "hunt",
  ).length;
  const tradePend = state.grid.filter(
    (g) => g.reduceOnly && (g.status === "armed" || g.status === "open") && g.origin === "hunt",
  ).length;
  const gridHarvest = journal.filter((j) => j.status === "closed" && (j.source === "\u0634\u0628\u0643\u0629" || j.source === "\u0645\u0631\u0643\u0632") && j.pnl > 0).length;
  const harvested = journal.filter((j) => j.status === "closed");
  const hanging = journal.filter((j) => j.status === "open");
  const harvestedPnl = harvested.reduce((s, j) => s + j.pnl, 0);
  const harvestedCount = harvested.filter((j) => j.pnl > 0).length;
  const losingClosed = harvested.filter((j) => j.pnl < 0).length;
  const winPnl = harvested.filter((j) => j.pnl > 0).reduce((s, j) => s + j.pnl, 0);
  const losePnl = harvested.filter((j) => j.pnl < 0).reduce((s, j) => s + j.pnl, 0);
  const feesClosed = harvested.reduce((s, j) => s + (j.fees || 0), 0);
  const feesOpen = hanging.reduce((s, j) => s + (j.fees || 0), 0);
  const grossWin = harvested.filter((j) => j.pnl > 0).reduce((s, j) => s + j.pnl + (j.fees || 0), 0);
  return {
    gridOpen,
    gridPend,
    gridHarvest,
    tradeOpen,
    tradePend,
    harvestedPnl,
    harvestedCount,
    losingClosed,
    losingOpen: hanging.some((j) => {
      const mark = state.markPrice || state.lastPrice || 0;
      if (!mark) return (state.position?.unrealized ?? 0) < 0;
      const sign = j.side === "short" ? 1 : -1;
      return sign * (j.entry - mark) * state.multiplier * j.qty < 0;
    }),
    winCount: harvestedCount,
    loseCount: losingClosed,
    hangingCount: hanging.length,
    winPnl,
    losePnl,
    feesPaid: state.feesPaid,
    feesClosed,
