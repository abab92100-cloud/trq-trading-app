name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Wrap with Capacitor Android shell
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/cli @capacitor/core @capacitor/android
          npx --yes cap init "TRQ Trading" com.trq.trading --web-dir dist
          npx --yes cap add android
          npx --yes cap sync android

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trq-trading-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: TRQ Trading APK — build ${{ github.run_number }}
          body: |
            حمّل ملف **app-debug.apk** على جوالك وثبّته مباشرة.
            داخل التطبيق: الإعدادات ← أدخل مفاتيح KuCoin (تداول فقط) ← تشغيل.
          files: android/app/build/outputs/apk/debug/app-debug.apk
