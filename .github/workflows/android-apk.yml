name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Wrap with Capacitor Android shell
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications
          npx --yes cap add android
          npx --yes cap sync android

      - name: Ensure stable signing keystore (same signature every build)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v -keystore keystore/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=TRQ Trading,O=TRQ,C=SA"
            git config user.name "TRQ Bot"
            git config user.email "bot@trq.local"
            git add keystore/debug.keystore
            git commit -m "Add stable debug keystore [skip ci]"
            git push
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../keystore/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Add foreground keep-alive service (background trading)
        run: |
          mkdir -p android/app/src/main/java/com/trq/trading
          cat > android/app/src/main/java/com/trq/trading/KeepAliveService.java <<'JAVA'
          package com.trq.trading;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class KeepAliveService extends Service {
              private PowerManager.WakeLock wakeLock;

              @Override public void onCreate() {
                  super.onCreate();
                  String ch = "trq_keepalive";
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(ch, "TRQ", NotificationManager.IMPORTANCE_MIN);
                      getSystemService(NotificationManager.class).createNotificationChannel(c);
                  }
                  Notification n = new Notification.Builder(this, ch)
                          .setContentTitle("TRQ Trading")
                          .setContentText("البوت متصل بالمنصة ويعمل")
                          .setSmallIcon(android.R.drawable.stat_notify_sync)
                          .setOngoing(true)
                          .build();
                  startForeground(42, n);
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "trq:keepalive");
                  wakeLock.acquire();
              }

              @Override public int onStartCommand(Intent i, int f, int s) { return START_STICKY; }

              @Override public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent i) { return null; }
          }
          JAVA
          python3 - <<'PY'
          p = 'android/app/src/main/java/com/trq/trading/MainActivity.java'
          open(p, 'w').write(
              'package com.trq.trading;\n\n'
              'import android.os.Bundle;\n'
              'import android.content.Intent;\n'
              'import com.getcapacitor.BridgeActivity;\n\n'
              'public class MainActivity extends BridgeActivity {\n'
              '    @Override public void onCreate(Bundle b) {\n'
              '        super.onCreate(b);\n'
              '        Intent i = new Intent(this, KeepAliveService.class);\n'
              '        if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);\n'
              '    }\n'
              '}\n')
          m = 'android/app/src/main/AndroidManifest.xml'
          x = open(m).read()
          if 'FOREGROUND_SERVICE' not in x:
              x = x.replace('<application',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <application', 1)
              x = x.replace('</application>',
                  '<service android:name=".KeepAliveService" android:foregroundServiceType="dataSync" android:exported="false" />\n'
                  '    </application>')
              open(m, 'w').write(x)
          PY

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trq-trading-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: TRQ Trading APK — build ${{ github.run_number }}
          body: |
            حمّل ملف **app-debug.apk** على جوالك وثبّته مباشرة.
            داخل التطبيق: الإعدادات ← أدخل مفاتيح KuCoin (تداول فقط) ← تشغيل.
          files: android/app/build/outputs/apk/debug/app-debug.apk
